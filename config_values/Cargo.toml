[package]
name = "aspen_config_values"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "How settings that are lists or tables are read, both from a configuration file and from the environment, for the API and voice servers."

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
config = { version = "0.15.14", features = ["toml"] }
