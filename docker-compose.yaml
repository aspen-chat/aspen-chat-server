# Not appropriate for production use cases
services:
  database:
    image: postgres:alpine
    volumes:
      - db:/data/postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: aspen_test
      PGDATA: /data/postgress
    ports:
      - "5432:5432"
  nats:
    image: nats:alpine
    command: --jetstream --auth aspen_test
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
  valkey:
    image: valkey/valkey:alpine
    ports:
      - "6379:6379"
  garage:
    image: dxflrs/garage:v2.2.0
    command: /garage -c /etc/garage.toml server
    # Bootstrap commands are documented in garage/README.md.
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3903:3903"
volumes:
  db:
  garage_meta:
  garage_data:
