[package]
name = "aspen_sockets"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Listening sockets of one address family each, so a server listens over IPv4 and IPv6 on one port, shared by the API and voice servers."

[dependencies]
libc = "0.2"
socket2 = "0.6.3"
tokio = { version = "1.51.1", features = ["net"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.51.1", features = ["macros", "rt"] }
