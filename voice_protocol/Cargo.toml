[package]
name = "voice_protocol"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "What the API server and the voice servers agree on: the join token and the control messages they exchange over NATS."

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
aws-lc-rs = "1.13"
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.16.0", features = ["serde", "v7"] }

[dev-dependencies]
async-nats = { version = "0.46.0", features = ["aws-lc-rs", "jetstream", "server_2_10", "server_2_11"], default-features = false }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time"] }
