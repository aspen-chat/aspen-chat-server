[package]
name = "voice_media"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The voice server's media: threads that each hold the WebRTC connections of the calls given to them, through str0m, and forward what each participant sends to the others."

[dependencies]
aspen_sockets = { version = "0.1.0", path = "../sockets" }
libc = "0.2"
# AWS-LC, the crypto rustls uses in this workspace too; no OpenSSL.
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.51.1", features = ["sync"] }
tracing = "0.1.41"
uuid = "1.16.0"
voice_protocol = { path = "../voice_protocol" }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["full"] }
