# Every push and pull request: the Rust workspace is formatted, lint-free, and tested on
# x86-64, changes to access are checked to reach everything already open
# (`scripts/check_permissions.py`), and calls are made between real browsers through a real
# voice server (`scripts/check_calls.py`); the servers write the schemas the client is generated from;
# the client is formatted, typechecks, lints, and passes its tests, its browser tests split
# across six runners; the desktop app is packaged for Windows, macOS, and as a Flatpak, and
# the Android and iOS apps are built, the Android APK kept, `main`'s builds for Windows, macOS,
# and the App Store signed, the dmgs sent for notarization; two deployments federate and wake
# a stand-in phone over real TLS; the images are built and each server started in its own, and
# the AWS configuration passes its plan tests; the servers are built for 64-bit ARM two ways,
# natively and with the cross-compile script, and each build is started against real services
# on an ARM machine; and Ultra Lite (`aspen-ul`) is checked as the full deployment is, its
# permissions, calls, and channel mana, started, used, and left for the full deployment, and
# packaged for x86-64 and 64-bit ARM, each package installed and run under systemd on a machine
# of its architecture. A tag `v*` runs it all and then publishes those packages as its release.
#
# The work is spread across runners so the whole run takes about as long as its longest job: the
# debug servers are built once (`servers`) and every job that runs them unpacks that build
# (`.github/actions/debug-servers`), the permissions check is split three ways, and lints, tests,
# and the checks each run on a runner of their own. Caches are saved from `main` alone, which
# every pull request reads: the repository's caches share 10 GB, and caches saved for each pull
# request push out the ones `main` keeps.
#
# The ARM binaries are built against Debian 12 (bookworm, glibc 2.36), so they run on
# Raspberry Pi OS Bookworm and newer, and with jemalloc built for 64 KiB pages, which also
# serves the 16 KiB-page kernel a Raspberry Pi 5 boots by default.

name: CI

on:
  push:
    branches: [main]
    # A release: everything below runs, and once it passes, Ultra Lite's packages are published
    # with it (`release`).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug and test builds keep only line tables, enough for a backtrace's files and lines, which
  # halves their target directories, and so the caches and the debug servers' artifact, and
  # shortens their builds by about a tenth. Release builds keep none either way.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # pip installs what the checks' scripts import (the federation check's `cryptography`) into
  # the runner's own Python.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  rust-lint:
    name: Rust (x86-64) — format and lint, the capture helper, and the example plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The desktop shell's capture helper is a workspace of its own; on Linux it links PipeWire
      # and libopus and no libobs.
      - name: Capture helper (Linux)
        run: |
          cargo fmt --manifest-path client/packages/desktop/native/capture/Cargo.toml --check
          cargo clippy --locked --manifest-path client/packages/desktop/native/capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path client/packages/desktop/native/capture/Cargo.toml
      # The example plugins are workspaces of their own, built for WebAssembly components.
      - name: Example plugins
        run: |
          for plugin in word_filter forum calendar blackjack; do
            cargo fmt --manifest-path plugins/$plugin/Cargo.toml --check
            cargo clippy --locked --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2 --all-targets -- -D warnings
            cargo test --locked --manifest-path plugins/$plugin/Cargo.toml
            cargo build --locked --release --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2
          done
      # Each example with views ships a copy of `bridge.js`, the views' side of the app's port
      # protocol, so that each stands alone; the copies are one text.
      - name: Example plugins' view bridges are alike
        run: |
          for bridge in plugins/*/views/bridge.js; do
            cmp plugins/forum/views/bridge.js "$bridge"
          done

  rust-test:
    name: Rust (x86-64) — tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The short-lived store's tests run against a real Valkey, and the bus's against a real
      # NATS as well as the one in memory, the ones docker-compose.yaml runs.
      - name: Valkey and NATS for the tests
        run: |
          docker compose up -d valkey nats
          timeout 30 sh -c 'until docker compose exec -T valkey valkey-cli ping | grep -q PONG; do sleep 1; done'
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; do sleep 1; done'
      - run: cargo test --locked --workspace
        env:
          ASPEN_BUS_TEST_NATS: nats://127.0.0.1:4222
          ASPEN_BUS_TEST_NATS_TOKEN: aspen_test

  # The debug servers, built once for every job that runs them (`.github/actions/debug-servers`),
  # and the API, event, and signalling schemas they write, which the client's code generator
  # reads.
  servers:
    name: Servers (x86-64) — debug build and schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p aspen-chat-server -p voice_server -p aspen-migrate -p aspen-ul
      - name: Write the API and signalling schemas
        run: |
          target/debug/aspen-chat-server --gen-openapi-schema
          target/debug/voice_server --gen-signal-schema
      - uses: actions/upload-artifact@v7
        with:
          name: schemas
          path: |
            openapi.yaml
            event_schema.json
            voice_signal_schema.json
      # Packed first, since an artifact keeps no file modes; already compressed, so the upload
      # does not compress it again.
      - name: Pack the servers
        run: tar -C target/debug --zstd -cf servers-debug.tar.zst aspen-chat-server voice_server aspen-migrate aspen-ul
      - uses: actions/upload-artifact@v7
        with:
          name: servers-debug
          path: servers-debug.tar.zst
          compression-level: 0
          retention-days: 1

  # The PostgreSQL Ultra Lite bundles, built from source against the baseline's sysroot for
  # x86-64 (`scripts/package_ul.py --postgres-only`), which the checks run the debug aspen-ul with
  # (`.github/actions/ul-postgres`) and its x86-64 package bundles. Built again only when the
  # scripts that build it change, its build cached from `main`.
  ul-postgres:
    name: Ultra Lite — PostgreSQL (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: target/ul/x86_64
          key: ul-postgres-x86_64-${{ hashFiles('scripts/package_ul.py', 'scripts/baseline_build.py') }}
      - name: System packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm make patchelf
      - name: Build
        run: python3 scripts/package_ul.py --arch x86_64 --postgres-only
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: target/ul/x86_64
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # The installation and the mark saying it is built, at the paths package_ul.py looks for
      # them, without the build tree.
      - name: Pack
        run: |
          prefix=$(python3 scripts/package_ul.py --arch x86_64 --postgres-only)
          prefix=${prefix#"$PWD/"}
          tar --zstd -cf ul-postgres.tar.zst "$prefix" "$(dirname "$prefix")/.built"
      - uses: actions/upload-artifact@v7
        with:
          name: ul-postgres
          path: ul-postgres.tar.zst
          compression-level: 0
          retention-days: 1

  # The web client as a release serves it, which Ultra Lite's packages bundle.
  web-client:
    name: Web client — built
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # The code generator reads these from the repository root, and would otherwise run cargo.
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The Open Source Attributions list is made from `cargo metadata` when the app is built.
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-client
          path: client/packages/app/dist
          retention-days: 1

  # Every change to access tried against a deployment of its own, watching what each side of it
  # already has open: REST, event streams, calls, operator commands, attachments. Each part runs
  # every third scenario on a deployment of its own, the full one and Ultra Lite.
  permissions:
    name: Changes to access reach everything already open (${{ matrix.deployment }}, ${{ matrix.shard }}/3)
    needs: [servers, ul-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every part runs to the end, so one failure does not hide another's.
      fail-fast: false
      matrix:
        deployment: [full, ultra-lite]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/debug-servers
      - uses: ./.github/actions/ul-postgres
        if: matrix.deployment == 'ultra-lite'
      # The plugin scenarios build the example plugins for `wasm32-wasip2`.
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - run: >-
          python3 scripts/check_permissions.py --bin target/debug --shard ${{ matrix.shard }}/3
          ${{ matrix.deployment == 'ultra-lite' && '--ul' || '--start-services' }}

  # Ultra Lite's debug build started and used, channel mana in it, and a deployment leaving it for
  # the full one, whose services are containers of the check's own.
  ultra-lite:
    name: Ultra Lite — starts and serves, channel mana, and leaving it
    needs: [servers, ul-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/debug-servers
      - uses: ./.github/actions/ul-postgres
      - name: Starts and serves
        run: python3 scripts/smoke_servers.py --bin target/debug --ul
      - name: Channel mana spends, queues, drains by rank, and tells viewers
        run: python3 scripts/check_mana.py --bin target/debug --ul
      - name: A deployment leaves it whole, into a full deployment
        run: >-
          python3 scripts/check_ul_export.py --ul target/debug/aspen-ul --bin target/debug
          --ul-postgres "$(python3 scripts/package_ul.py --arch x86_64 --postgres-only)"

  nats-and-mana:
    name: NATS memory and channel mana
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/debug-servers
      - name: The NATS streams fit their settings and NATS's memory
        run: python3 scripts/check_nats_memory.py --bin target/debug --start-services
      - name: Channel mana spends, queues, drains by rank, and tells viewers
        run: python3 scripts/check_mana.py --bin target/debug

  # Calls between Chromium and Chromium, and Chromium and Firefox, made by the client's own call
  # code through the voice server: the full deployment's, and the one within Ultra Lite.
  calls:
    name: Calls between real browsers (${{ matrix.deployment }})
    needs: [servers, ul-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deployment: [full, ultra-lite]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/debug-servers
      - uses: ./.github/actions/ul-postgres
        if: matrix.deployment == 'ultra-lite'
      # The code generator, which installing the client's dependencies runs, reads these from the
      # repository root, and would otherwise run cargo.
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm --dir client --filter @aspen/app exec playwright install --with-deps chromium firefox
      # The runner has no sound server, without which Firefox plays and records only silence;
      # PulseAudio with no sound card gives it a null sink and that sink's monitor.
      - name: Sound server
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - run: >-
          python3 scripts/check_calls.py --bin target/debug
          ${{ matrix.deployment == 'ultra-lite' && '--ul' || '--start-services' }}

  client:
    name: Client — format, typecheck, lint, test
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # The code generator reads these from the repository root, and would otherwise run cargo.
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # or served (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The Playwright specs answer every request from stubs, so they need no server. Chromium
  # covers a desktop and a phone; the full matrix is `pnpm e2e` locally. They are split across
  # runners, each starting its own dev server, so each part finishes well inside its limit.
  client-browser:
    name: Client — browser tests (${{ matrix.shard }}/6)
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every part runs to the end, so one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The dev server makes the Open Source Attributions list from `cargo metadata`.
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Browser tests (desktop and phone, Chromium)
        run: |
          pnpm --filter @aspen/app exec playwright install --with-deps chromium
          pnpm --filter @aspen/app exec playwright test --project=chromium --project=phone-chromium --shard=${{ matrix.shard }}/6

  # The installer is signed for pushes to `main` alone, whatever is signed carrying the
  # publisher's name: the Azure credentials are in the `windows-signing` environment, which only
  # `main` may use. Every other run (a pull request, a dispatch on any branch) takes no
  # environment and builds an unsigned installer.
  desktop-windows:
    name: Desktop (Windows) — installer with libobs
    needs: servers
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'windows-signing' || '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      # bindgen reads libobs's headers through libclang, which the runner's LLVM provides.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/packages/desktop/native/capture
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # The OBS Project's own signed release files, pinned by checksum (`scripts/fetch-libobs.mjs`).
      - run: pnpm --filter @aspen/desktop fetch:libobs
      - if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm --filter @aspen/desktop package
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @aspen/desktop package:signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Check that our files carry our signature, and the OBS Project's theirs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: client/packages/desktop/release
        run: |
          # The start of the certificate's subject (`publisherName` in electron-builder.signed.yml).
          $publisher = 'CN=Jacob Kiesel,'
          $ours = @(Get-ChildItem *.exe) + @(Get-Item win-unpacked/Aspen.exe, win-unpacked/resources/aspen-capture.exe)
          foreach ($file in $ours) {
            $signature = Get-AuthenticodeSignature $file
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) has no valid signature: $($signature.StatusMessage)" }
            if (-not $signature.SignerCertificate.Subject.StartsWith($publisher)) { throw "$($file.Name) is not signed by $publisher" }
            # The certificate lasts days; past them the signature holds only by its timestamp.
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name)'s signature has no timestamp" }
          }
          $hook = 'win-unpacked/resources/libobs/data/obs-plugins/win-capture'
          # The hook's files, and the GPU encoders' test programs beside the helper, which libobs
          # runs from there; a package missing one of the three silently loses that encoder.
          $theirs = @(Get-Item $hook/graphics-hook64.dll, $hook/inject-helper64.exe, $hook/get-graphics-offsets64.exe) + @(Get-Item win-unpacked/resources/obs-*-test.exe)
          if ($theirs.Count -ne 6) { throw "expected the three hook files and three encoder test programs, found $($theirs.Count)" }
          foreach ($file in $theirs) {
            $signature = Get-AuthenticodeSignature $file
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) has no valid signature: $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.Subject.StartsWith($publisher)) { throw "$($file.Name) carries our signature in place of the OBS Project's" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: client/packages/desktop/release/*.exe

  # The capture helper's macOS code (ScreenCaptureKit, CoreMedia), and on a pull request
  # unsigned dmgs for Apple Silicon and Intel; `main` signs and notarizes them in
  # `desktop-macos-signed`.
  desktop-macos:
    name: Desktop (macOS) — capture helper and dmg
    needs: servers
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/packages/desktop/native/capture
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Capture helper — lints and tests
        run: |
          cargo clippy --locked --manifest-path packages/desktop/native/capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path packages/desktop/native/capture/Cargo.toml
      - if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm codegen
      - if: github.event_name == 'pull_request'
        run: pnpm --filter @aspen/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: client/packages/desktop/release/*.dmg

  # Signed with the Developer ID Application identity, for `main` alone: the secrets are in the
  # `apple-signing` environment, which only `main` may use, and whatever is signed carries the
  # publisher's name. The dmgs are sent to Apple's notary service without waiting for its answer,
  # which can take days; `notarized-dmg.yml` staples them once Apple accepts them.
  desktop-macos-signed:
    name: Desktop (macOS) — signed dmg, sent for notarization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop-macos
    environment: apple-signing
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/packages/desktop/native/capture
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # Without the `APPLE_API_*` variables electron-builder signs the apps and skips notarizing
      # them, with a warning.
      - run: pnpm --filter @aspen/desktop package:signed
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      # The dmg is what is notarized and stapled, and a ticket is found by its signature, so the
      # dmg is signed too: here, with a timestamp, which electron-builder's own signing of a dmg
      # does not ask for.
      - name: Sign the dmgs
        working-directory: client/packages/desktop/release
        run: |
          keychain="$RUNNER_TEMP/dmg-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # On the search list, as electron-builder puts its own: off it, codesign finds no valid
          # identity in the keychain.
          searched="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $searched
          security find-identity -v -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*) \([0-9A-F]\{40\}\) "Developer ID Application: Jacob Kiesel (L2GS25U79G)"$/\1/p')"
          [ -n "$identity" ] || { echo "The .p12 holds no valid Developer ID Application identity"; exit 1; }
          for dmg in *.dmg; do
            codesign --sign "$identity" --timestamp --keychain "$keychain" "$dmg"
          done
          # shellcheck disable=SC2086
          security list-keychains -d user -s $searched
          security delete-keychain "$keychain"
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Check each app's architecture, signature, and hardened runtime, and each dmg's signature
        working-directory: client/packages/desktop/release
        run: |
          signed_by_us() {
            details="$(codesign -dvv "$1" 2>&1)"
            echo "$details" | grep -q '^Authority=Developer ID Application: Jacob Kiesel (L2GS25U79G)$' \
              || { echo "$1 is not signed with the Developer ID Application identity"; exit 1; }
            echo "$details" | grep -q '^Timestamp=' || { echo "$1's signature has no timestamp"; exit 1; }
          }
          for pair in mac-arm64:arm64 mac:x86_64; do
            app="${pair%%:*}/Aspen.app"
            # One architecture a call: Xcode 27's lipo takes no more.
            lipo "$app/Contents/MacOS/Aspen" -verify_arch "${pair##*:}" \
              || { echo "$app is not built for ${pair##*:}"; exit 1; }
            for arch in arm64 x86_64; do
              lipo "$app/Contents/Resources/aspen-capture" -verify_arch "$arch" \
                || { echo "$app's capture helper is not built for $arch"; exit 1; }
            done
            codesign --verify --deep --strict --verbose=2 "$app"
            for file in "$app" "$app/Contents/Resources/aspen-capture"; do
              signed_by_us "$file"
              codesign -dvv "$file" 2>&1 | grep -q 'flags=.*runtime' || { echo "$file lacks the hardened runtime"; exit 1; }
            done
          done
          for dmg in *.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            signed_by_us "$dmg"
          done
      - name: Send the dmgs to the notary service
        working-directory: client/packages/desktop/release
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notarization.p8"
          echo '[]' > submissions.json
          for dmg in *.dmg; do
            id="$(xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notarization.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json | jq -r .id)"
            echo "$dmg: submission $id"
            jq --arg dmg "$dmg" --arg id "$id" '. + [{dmg: $dmg, id: $id}]' submissions.json > submissions.next
            mv submissions.next submissions.json
          done
          rm "$RUNNER_TEMP/notarization.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # `notarized-dmg.yml` finds this by its name.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-unstapled
          path: |
            client/packages/desktop/release/*.dmg
            client/packages/desktop/release/submissions.json

  # The app and its UI tests built for the simulator, unsigned, and the extension's Web Push
  # decryption checked against RFC 8291's example. The UI tests themselves need a deployment
  # (`client/docs/architecture/ios-app.md`), which these runners cannot hold.
  ios:
    name: iOS — simulator build and Web Push check
    needs: servers
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the iOS project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync ios
      - run: xcodebuild -version
      - name: Build the app and its UI tests for the simulator
        working-directory: client/packages/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - run: packages/mobile/ios/scripts/check_webpush.sh

  # An App Store build, signed by hand (`app_store.py`), for `main` alone, from the
  # `apple-signing` environment's secrets. It is sent to App Store Connect as a TestFlight build
  # only while the repository variable `TESTFLIGHT_UPLOAD` is `true`; otherwise the signed `.ipa`
  # is exported and kept, which shows the signing still works.
  ios-testflight:
    name: iOS — App Store build for TestFlight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios
    environment: apple-signing
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the iOS project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync ios
      - name: The certificate, the profiles, and the App Store Connect key
        run: |
          printf '%s' "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$IOS_PROFILE_NOTIFICATIONS" | base64 --decode > "$RUNNER_TEMP/notifications.mobileprovision"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/app-store-connect.p8"
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_NOTIFICATIONS: ${{ secrets.IOS_PROFILE_NOTIFICATIONS }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # The build number grows with every run and every attempt of one, as App Store Connect
      # requires of the builds of one version.
      - name: Archive, sign, and export${{ vars.TESTFLIGHT_UPLOAD == 'true' && ' and upload' || '' }}
        run: |
          packages/mobile/ios/scripts/app_store.py \
            --certificate "$RUNNER_TEMP/distribution.p12" \
            --profile "$RUNNER_TEMP/app.mobileprovision" \
            --profile "$RUNNER_TEMP/notifications.mobileprovision" \
            --build-number "${{ github.run_number }}.${{ github.run_attempt }}" \
            --relay "$ASPEN_PUSH_RELAY" \
            --api-key "$RUNNER_TEMP/app-store-connect.p8" \
            --api-key-id "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER" \
            ${{ vars.TESTFLIGHT_UPLOAD == 'true' && '--upload' || '' }}
        env:
          ASPEN_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          ASPEN_PUSH_RELAY: ${{ vars.ASPEN_PUSH_RELAY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: vars.TESTFLIGHT_UPLOAD != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-store
          path: target/ios-app-store/*.ipa

  desktop-flatpak:
    name: Desktop (Linux) — Flatpak
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # librsvg2-common is the SVG loader appstreamcli compose reads the app's icon with; it is
      # only recommended, and without it the build fails with `file-read-error`.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common \
            pkg-config libpipewire-0.3-dev libopus-dev libclang-dev
      # Flatpak builds and runs in sandboxes made with user namespaces, which the runner's
      # AppArmor keeps from programs it has no profile for.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # What `packages/desktop/flatpak/com.aspen_chat.client.yml` builds on and runs in.
      - name: Flatpak runtime, SDK, and base app
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/packages/desktop/native/capture
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm --filter @aspen/desktop package:flatpak
      # The capture helper answering inside the sandbox shows that the app's files are where
      # the launcher expects them and that the runtime has the libraries the helper links.
      - name: Install it, and ask the capture helper what it can capture
        working-directory: client/packages/desktop/release/flatpak
        run: |
          flatpak install --user --noninteractive ./Aspen-*.flatpak
          echo '{"type":"kinds","id":1}' \
            | flatpak run --command=/app/aspen/resources/aspen-capture com.aspen_chat.client \
            | grep '"type":"kinds"'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-flatpak
          path: client/packages/desktop/release/flatpak/*.flatpak

  android:
    name: Android — build, unit, and device tests, and the APK
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # Capacitor 8's Android build wants JDK 21; the runner already has the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # or served (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the Android project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync android
      - name: Build and unit test
        working-directory: client/packages/mobile/android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug
        env:
          ASPEN_BUILD_NUMBER: ${{ github.run_number }}
          ASPEN_BUILD_COMMIT: ${{ github.sha }}
      # Kept before the device tests run, so a failing emulator still leaves the APK to install.
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-debug
          path: client/packages/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # The push handler's test posts and cancels real notifications, so it runs on an emulator,
      # which the runner accelerates with KVM once its device node is opened to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/packages/mobile/android
          script: ./gradlew --console=plain :app:connectedDebugAndroidTest

  federation-and-push:
    name: Federation and push — two deployments over TLS
    needs: servers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl python3-pip
          pip install cryptography
      - uses: ./.github/actions/debug-servers
      - name: Start both deployments
        run: python3 scripts/dev_federation.py up --start-services
      - name: Federation between them
        run: python3 scripts/dev_federation.py check
      - name: Waking phones
        run: python3 scripts/dev_push.py
      - name: Server logs
        if: failure()
        run: tail -n 200 target/dev-federation/*/server.log

  deploy-configurations:
    name: Deployment configurations — OpenTofu tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy
      # It plans against made-up providers, so it needs no AWS account.
      - name: Validate and test
        run: |
          tofu -chdir=deploy/aws init -backend=false -input=false
          tofu -chdir=deploy/aws validate
          tofu -chdir=deploy/aws test
      # AWS's read path and the development one pass the prefixes the server stores public
      # objects under, read from the files.
      - run: python3 scripts/check_media_prefixes.py

  # Both images built as `images.yml` publishes them, and each server started in its own.
  images:
    name: Images — built, and each server started
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The images workflow's cache for this architecture, read but not written: a pull
      # request's build is not one to build from.
      - name: api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: api
          load: true
          tags: aspen-api:check
          cache-from: type=gha,scope=image-amd64
      - name: voice image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: voice
          load: true
          tags: aspen-voice:check
          cache-from: type=gha,scope=image-amd64
      # Each writes its schemas and exits, which needs no configuration: a binary that does not
      # start in its image fails here.
      - run: docker run --rm aspen-api:check aspen-chat-server --gen-openapi-schema
      - run: docker run --rm aspen-voice:check voice_server --gen-signal-schema

  # The release build and the workspace's tests in release, each on a runner of its own; the
  # tests' build, which holds every dependency the servers' build does and more, keeps the cache
  # both read.
  arm64-native:
    name: ARM64 (Debian 12) — build natively
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 60
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libssl-dev libpq-dev python3 binutils
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: arm64-bookworm
          save-if: false
      - run: cargo build --locked --release -p aspen-chat-server -p voice_server -p aspen-migrate
      - name: Check the binaries (architecture, glibc, start-up, jemalloc's page size)
        run: python3 scripts/baseline_build.py --arch aarch64 check --dir target/release
      - name: Package
        run: |
          mkdir dist
          cp target/release/aspen-chat-server target/release/voice_server target/release/aspen-migrate dist/
          tar -C dist -czf aspen-aarch64-bookworm.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-aarch64-bookworm
          path: aspen-aarch64-bookworm.tar.gz

  arm64-native-test:
    name: ARM64 (Debian 12) — test natively
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 60
    # The second-factor failure limit's tests count attempts in a real Valkey, which a job in a
    # container reaches by its service's name.
    services:
      valkey:
        image: valkey/valkey:alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
      VALKEY_URL: redis://valkey:6379
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libssl-dev libpq-dev
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: arm64-bookworm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --release --workspace

  arm64-cross:
    name: ARM64 (Debian 12) — cross-compile on x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: arm64-cross
          cache-directories: target/cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up, build, and check
        run: python3 scripts/baseline_build.py --arch aarch64
      - name: Package
        run: |
          mkdir dist
          out=$(python3 scripts/baseline_build.py --arch aarch64 out)
          for binary in aspen-chat-server voice_server aspen-migrate; do
            cp "$out/$binary" dist/
          done
          # Packed with its runtime by `ul-aarch64`.
          cp "$out/aspen-ul" aspen-ul-binary
          tar -C dist -czf aspen-aarch64-bookworm-cross.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-aarch64-bookworm-cross
          path: aspen-aarch64-bookworm-cross.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ul-binary-aarch64
          path: aspen-ul-binary
          retention-days: 1

  x86_64-baseline:
    name: x86-64 (Debian 12) — build against the baseline, start, and serve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-baseline
          cache-directories: target/cross
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up, build, and check
        run: python3 scripts/baseline_build.py --arch x86_64
      - name: Package
        run: |
          mkdir dist
          out=$(python3 scripts/baseline_build.py --arch x86_64 out)
          for binary in aspen-chat-server voice_server aspen-migrate; do
            cp "$out/$binary" dist/
          done
          # Packed with its runtime by `ul-x86_64`.
          cp "$out/aspen-ul" aspen-ul-binary
          tar -C dist -czf aspen-x86_64-bookworm.tar.gz .
      - name: Start the services, then the servers, and use them
        run: python3 scripts/smoke_servers.py --bin dist --start-services
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-x86_64-bookworm
          path: aspen-x86_64-bookworm.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ul-binary-x86_64
          path: aspen-ul-binary
          retention-days: 1

  arm64-smoke:
    name: ARM64 — servers start and serve (${{ matrix.build }})
    needs: [arm64-native, arm64-cross]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [aspen-aarch64-bookworm, aspen-aarch64-bookworm-cross]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build }}
      - name: Unpack
        run: mkdir dist && tar -C dist -xzf "${{ matrix.build }}.tar.gz"
      - name: Start the services, then the servers, and use them
        run: python3 scripts/smoke_servers.py --bin dist --start-services

  # Ultra Lite as it is released (`scripts/package_ul.py`): the baseline build of aspen-ul with
  # the bundled PostgreSQL and the web client appended, installed and run as an operator runs it
  # on a Debian 12 machine under systemd (`scripts/check_ul.py`), and kept as an artifact.
  ul-x86_64:
    name: Ultra Lite (x86-64) — packaged, installed, and run
    needs: [x86_64-baseline, web-client, ul-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ul-postgres
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
      - uses: actions/download-artifact@v8
        with:
          name: ul-binary-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: web-client
          path: web-client
      - name: Package
        run: |
          chmod +x aspen-ul-binary
          python3 scripts/package_ul.py --arch x86_64 --binary aspen-ul-binary --web-client web-client \
            --out aspen-ul-x86_64
      - name: Install it on Debian 12 under systemd and run it
        run: python3 scripts/check_ul.py --ul aspen-ul-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-ul-x86_64
          path: aspen-ul-x86_64
          compression-level: 0

  # The 64-bit ARM package, its PostgreSQL cross-compiled here (with the x86-64 build's time zone
  # compiler, so both are built), and checked on an ARM machine by `ul-aarch64-check`.
  ul-aarch64:
    name: Ultra Lite (64-bit ARM) — packaged
    needs: [arm64-cross, web-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: target/ul
          key: ul-postgres-aarch64-${{ hashFiles('scripts/package_ul.py', 'scripts/baseline_build.py') }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm make patchelf zstd
      - uses: actions/download-artifact@v8
        with:
          name: ul-binary-aarch64
      - uses: actions/download-artifact@v8
        with:
          name: web-client
          path: web-client
      - name: Package
        run: |
          chmod +x aspen-ul-binary
          python3 scripts/package_ul.py --arch aarch64 --binary aspen-ul-binary --web-client web-client \
            --out aspen-ul-aarch64
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: target/ul
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-ul-aarch64
          path: aspen-ul-aarch64
          compression-level: 0

  ul-aarch64-check:
    name: Ultra Lite (64-bit ARM) — installed and run
    needs: ul-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
      - uses: actions/download-artifact@v8
        with:
          name: aspen-ul-aarch64
      - name: Install it on Debian 12 under systemd and run it
        run: |
          chmod +x aspen-ul-aarch64
          python3 scripts/check_ul.py --ul aspen-ul-aarch64

  # A tag `v*` publishes Ultra Lite's two packages as its GitHub release, with their checksums,
  # once every check of the servers has passed.
  release:
    name: Release — Ultra Lite's packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-lint, rust-test, permissions, nats-and-mana, ultra-lite, calls, ul-x86_64, ul-aarch64-check, arm64-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aspen-ul-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: aspen-ul-aarch64
      - run: sha256sum aspen-ul-x86_64 aspen-ul-aarch64 > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          aspen-ul-x86_64 aspen-ul-aarch64 SHA256SUMS
