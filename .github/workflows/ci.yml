# Every push and pull request: the Rust workspace is formatted, lint-free, and tested on
# x86-64, and changes to access are checked to reach everything already open
# (`scripts/check_permissions.py`); the client typechecks, lints, and passes its tests; two deployments federate and
# wake a stand-in phone over real TLS; and the servers are built for
# 64-bit ARM two ways, natively and with the cross-compile script, and each build is started
# against real services on an ARM machine.
#
# The ARM binaries are built against Debian 12 (bookworm, glibc 2.36), so they run on
# Raspberry Pi OS Bookworm and newer, and with jemalloc built for 64 KiB pages, which also
# serves the 16 KiB-page kernel a Raspberry Pi 5 boots by default.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mediasoup's build installs its build tools with pip into a directory of its own.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  rust:
    name: Rust (x86-64) — format, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev python3-pip \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The example plugin, which the permissions check installs.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The desktop shell's capture helper is a workspace of its own; on Linux it links PipeWire
      # and libopus and no libobs.
      - name: Capture helper (Linux)
        run: |
          cargo fmt --manifest-path client/packages/desktop/native/obs-capture/Cargo.toml --check
          cargo clippy --locked --manifest-path client/packages/desktop/native/obs-capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path client/packages/desktop/native/obs-capture/Cargo.toml
      # The example plugins are workspaces of their own, built for WebAssembly components.
      - name: Example plugins
        run: |
          for plugin in word_filter forum calendar; do
            cargo fmt --manifest-path plugins/$plugin/Cargo.toml --check
            cargo clippy --locked --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2 -- -D warnings
            cargo test --locked --manifest-path plugins/$plugin/Cargo.toml
            cargo build --locked --release --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2
          done
      - name: Write the API and signalling schemas for the client
        run: |
          cargo run --locked -p aspen-chat-server -- --gen-openapi-schema
          cargo run --locked -p voice_server -- --gen-signal-schema
      # Every change to access tried against a deployment of its own, watching what each side
      # of it already has open: REST, event streams, calls, operator commands, attachments.
      - name: Changes to access reach everything already open
        run: |
          cargo build --locked -p aspen-chat-server -p voice_server -p aspen-migrate
          python3 scripts/check_permissions.py --bin target/debug --start-services
      - uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: |
            openapi.yaml
            event_schema.json
            voice_signal_schema.json

  client:
    name: Client — typecheck, lint, test
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      # The code generator reads these from the repository root, and would otherwise run cargo.
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The Playwright specs answer every request from stubs, so they need no server. Chromium
      # covers a desktop and a phone; the full matrix is `pnpm e2e` locally.
      - name: Browser tests (desktop and phone, Chromium)
        run: |
          pnpm --filter @aspen/app exec playwright install --with-deps chromium
          pnpm --filter @aspen/app exec playwright test --project=chromium --project=phone-chromium

  desktop-windows:
    name: Desktop (Windows) — installer with libobs
    needs: rust
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      # bindgen reads libobs's headers through libclang, which the runner's LLVM provides.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/packages/desktop/native/obs-capture
      # MSVC's `lib` writes the import library the helper links obs.dll through.
      - uses: ilammy/msvc-dev-cmd@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # The OBS Project's own signed release files, pinned by checksum (`scripts/fetch-libobs.mjs`).
      - run: pnpm --filter @aspen/desktop fetch:libobs
      - run: pnpm --filter @aspen/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: client/packages/desktop/release/*.exe

  android:
    name: Android — build, unit, and device tests
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # Capacitor 8's Android build wants JDK 21; the runner already has the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the Android project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync android
      - name: Build and unit test
        working-directory: client/packages/mobile/android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug
      # The push handler's test posts and cancels real notifications, so it runs on an emulator,
      # which the runner accelerates with KVM once its device node is opened to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/packages/mobile/android
          script: ./gradlew --console=plain :app:connectedDebugAndroidTest

  federation-and-push:
    name: Federation and push — two deployments over TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev openssl python3-pip
          pip install cryptography
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: federation-and-push
      - run: cargo build --locked -p aspen-chat-server -p aspen-migrate
      - name: Start both deployments
        run: python3 scripts/dev_federation.py up --start-services
      - name: Federation between them
        run: python3 scripts/dev_federation.py check
      - name: Waking phones
        run: python3 scripts/dev_push.py
      - name: Server logs
        if: failure()
        run: tail -n 200 target/dev-federation/*/server.log

  arm64-native:
    name: ARM64 (Debian 12) — build and test natively
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 90
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libssl-dev libpq-dev python3 python3-pip python3-venv binutils
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile default
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-bookworm
      - run: cargo build --locked --release -p aspen-chat-server -p voice_server -p aspen-migrate
      - run: cargo test --locked --release --workspace
      - name: Check the binaries (architecture, glibc, start-up, jemalloc's page size)
        run: python3 scripts/cross_aarch64.py check --dir target/release
      - name: Package
        run: |
          mkdir dist
          cp target/release/aspen-chat-server target/release/voice_server target/release/aspen-migrate dist/
          tar -C dist -czf aspen-aarch64-bookworm.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aspen-aarch64-bookworm
          path: aspen-aarch64-bookworm.tar.gz

  arm64-cross:
    name: ARM64 (Debian 12) — cross-compile on x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config python3-pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-cross
          cache-directories: target/cross
      - name: Set up, build, and check
        run: python3 scripts/cross_aarch64.py
      - name: Package
        run: |
          mkdir dist
          for binary in aspen-chat-server voice_server aspen-migrate; do
            cp "target/aarch64-unknown-linux-gnu/release/$binary" dist/
          done
          tar -C dist -czf aspen-aarch64-bookworm-cross.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aspen-aarch64-bookworm-cross
          path: aspen-aarch64-bookworm-cross.tar.gz

  arm64-smoke:
    name: ARM64 — servers start and serve (${{ matrix.build }})
    needs: [arm64-native, arm64-cross]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [aspen-aarch64-bookworm, aspen-aarch64-bookworm-cross]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build }}
      - name: Unpack
        run: mkdir dist && tar -C dist -xzf "${{ matrix.build }}.tar.gz"
      - name: Start the services, then the servers, and use them
        run: python3 scripts/smoke_servers.py --bin dist --start-services
