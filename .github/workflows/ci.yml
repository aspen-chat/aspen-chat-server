# Every push and pull request: the Rust workspace is formatted, lint-free, and tested on
# x86-64, and changes to access are checked to reach everything already open
# (`scripts/check_permissions.py`); the servers write the schemas the client is generated from;
# the client is formatted, typechecks, lints, and passes its tests, its browser tests split
# across three runners; the desktop app is packaged for Windows, macOS, and as a Flatpak, and
# the Android and iOS apps are built, the Android APK kept, `main`'s builds for Windows, macOS,
# and the App Store signed, the dmgs sent for notarization; two deployments federate and wake
# a stand-in phone over real TLS; the box runs from images built here, and both AWS
# configurations pass their plan tests; and the servers are built for 64-bit ARM two ways,
# natively and with the cross-compile script, and each build is started against real services
# on an ARM machine.
#
# The ARM binaries are built against Debian 12 (bookworm, glibc 2.36), so they run on
# Raspberry Pi OS Bookworm and newer, and with jemalloc built for 64 KiB pages, which also
# serves the 16 KiB-page kernel a Raspberry Pi 5 boots by default.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mediasoup's build installs its build tools with pip into a directory of its own.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  rust:
    name: Rust (x86-64) — format, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev python3-pip \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The second-factor failure limit's tests count attempts in a real Valkey. The one
      # docker-compose.yaml runs, which the permissions check below starts again and finds up.
      - name: Valkey for the tests
        run: |
          docker compose up -d valkey
          timeout 30 sh -c 'until docker compose exec -T valkey valkey-cli ping | grep -q PONG; do sleep 1; done'
      - run: cargo test --locked --workspace
      # The desktop shell's capture helper is a workspace of its own; on Linux it links PipeWire
      # and libopus and no libobs.
      - name: Capture helper (Linux)
        run: |
          cargo fmt --manifest-path client/packages/desktop/native/capture/Cargo.toml --check
          cargo clippy --locked --manifest-path client/packages/desktop/native/capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path client/packages/desktop/native/capture/Cargo.toml
      # The example plugins are workspaces of their own, built for WebAssembly components.
      - name: Example plugins
        run: |
          for plugin in word_filter forum calendar blackjack; do
            cargo fmt --manifest-path plugins/$plugin/Cargo.toml --check
            cargo clippy --locked --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2 -- -D warnings
            cargo test --locked --manifest-path plugins/$plugin/Cargo.toml
            cargo build --locked --release --manifest-path plugins/$plugin/Cargo.toml --target wasm32-wasip2
          done
      # Every change to access tried against a deployment of its own, watching what each side
      # of it already has open: REST, event streams, calls, operator commands, attachments.
      - name: Changes to access reach everything already open
        run: |
          cargo build --locked -p aspen-chat-server -p voice_server -p aspen-migrate
          python3 scripts/check_permissions.py --bin target/debug --start-services
      - name: The NATS streams fit their settings and NATS's memory
        run: python3 scripts/check_nats_memory.py --bin target/debug
      - name: Channel mana spends, queues, drains by rank, and tells viewers
        run: python3 scripts/check_mana.py --bin target/debug

  # The API, event, and signalling schemas the client's code generator reads, written by the two
  # servers alone so the client, Android, and Windows jobs need not wait for the workspace's tests.
  schemas:
    name: Schemas — API, events, and signalling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev python3-pip \
            libpipewire-0.3-dev libopus-dev libclang-dev
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Write the API and signalling schemas
        run: |
          cargo run --locked -p aspen-chat-server -- --gen-openapi-schema
          cargo run --locked -p voice_server -- --gen-signal-schema
      - uses: actions/upload-artifact@v7
        with:
          name: schemas
          path: |
            openapi.yaml
            event_schema.json
            voice_signal_schema.json

  client:
    name: Client — format, typecheck, lint, test
    needs: schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # The code generator reads these from the repository root, and would otherwise run cargo.
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # or served (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The Playwright specs answer every request from stubs, so they need no server. Chromium
  # covers a desktop and a phone; the full matrix is `pnpm e2e` locally. They are split across
  # runners, each starting its own dev server, so each part finishes well inside its limit.
  client-browser:
    name: Client — browser tests (${{ matrix.shard }}/3)
    needs: schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every part runs to the end, so one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The dev server makes the Open Source Attributions list from `cargo metadata`.
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Browser tests (desktop and phone, Chromium)
        run: |
          pnpm --filter @aspen/app exec playwright install --with-deps chromium
          pnpm --filter @aspen/app exec playwright test --project=chromium --project=phone-chromium --shard=${{ matrix.shard }}/3

  # The installer is signed for pushes to `main` alone, whatever is signed carrying the
  # publisher's name: the Azure credentials are in the `windows-signing` environment, which only
  # `main` may use. Every other run (a pull request, a dispatch on any branch) takes no
  # environment and builds an unsigned installer.
  desktop-windows:
    name: Desktop (Windows) — installer with libobs
    needs: schemas
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'windows-signing' || '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      # bindgen reads libobs's headers through libclang, which the runner's LLVM provides.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/packages/desktop/native/capture
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # The OBS Project's own signed release files, pinned by checksum (`scripts/fetch-libobs.mjs`).
      - run: pnpm --filter @aspen/desktop fetch:libobs
      - if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm --filter @aspen/desktop package
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter @aspen/desktop package:signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Check that our files carry our signature, and the OBS Project's theirs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: client/packages/desktop/release
        run: |
          # The start of the certificate's subject (`publisherName` in electron-builder.signed.yml).
          $publisher = 'CN=Jacob Kiesel,'
          $ours = @(Get-ChildItem *.exe) + @(Get-Item win-unpacked/Aspen.exe, win-unpacked/resources/aspen-capture.exe)
          foreach ($file in $ours) {
            $signature = Get-AuthenticodeSignature $file
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) has no valid signature: $($signature.StatusMessage)" }
            if (-not $signature.SignerCertificate.Subject.StartsWith($publisher)) { throw "$($file.Name) is not signed by $publisher" }
            # The certificate lasts days; past them the signature holds only by its timestamp.
            if (-not $signature.TimeStamperCertificate) { throw "$($file.Name)'s signature has no timestamp" }
          }
          $hook = 'win-unpacked/resources/libobs/data/obs-plugins/win-capture'
          foreach ($file in Get-Item $hook/graphics-hook64.dll, $hook/inject-helper64.exe, $hook/get-graphics-offsets64.exe) {
            $signature = Get-AuthenticodeSignature $file
            "$($file.Name): $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) has no valid signature: $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.Subject.StartsWith($publisher)) { throw "$($file.Name) carries our signature in place of the OBS Project's" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: client/packages/desktop/release/*.exe

  # The capture helper's macOS code (ScreenCaptureKit, CoreMedia), and on a pull request
  # unsigned dmgs for Apple Silicon and Intel; `main` signs and notarizes them in
  # `desktop-macos-signed`.
  desktop-macos:
    name: Desktop (macOS) — capture helper and dmg
    needs: schemas
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/packages/desktop/native/capture
      - name: Capture helper — lints and tests
        run: |
          cargo clippy --locked --manifest-path packages/desktop/native/capture/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path packages/desktop/native/capture/Cargo.toml
      - if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm codegen
      - if: github.event_name == 'pull_request'
        run: pnpm --filter @aspen/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: client/packages/desktop/release/*.dmg

  # Signed with the Developer ID Application identity, for `main` alone: the secrets are in the
  # `apple-signing` environment, which only `main` may use, and whatever is signed carries the
  # publisher's name. The dmgs are sent to Apple's notary service without waiting for its answer,
  # which can take days; `notarized-dmg.yml` staples them once Apple accepts them.
  desktop-macos-signed:
    name: Desktop (macOS) — signed dmg, sent for notarization
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop-macos
    environment: apple-signing
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/packages/desktop/native/capture
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      # Without the `APPLE_API_*` variables electron-builder signs the apps and skips notarizing
      # them, with a warning.
      - run: pnpm --filter @aspen/desktop package:signed
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      # The dmg is what is notarized and stapled, and a ticket is found by its signature, so the
      # dmg is signed too: here, with a timestamp, which electron-builder's own signing of a dmg
      # does not ask for.
      - name: Sign the dmgs
        working-directory: client/packages/desktop/release
        run: |
          keychain="$RUNNER_TEMP/dmg-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # On the search list, as electron-builder puts its own: off it, codesign finds no valid
          # identity in the keychain.
          searched="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $searched
          security find-identity -v -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*) \([0-9A-F]\{40\}\) "Developer ID Application: Jacob Kiesel (L2GS25U79G)"$/\1/p')"
          [ -n "$identity" ] || { echo "The .p12 holds no valid Developer ID Application identity"; exit 1; }
          for dmg in *.dmg; do
            codesign --sign "$identity" --timestamp --keychain "$keychain" "$dmg"
          done
          # shellcheck disable=SC2086
          security list-keychains -d user -s $searched
          security delete-keychain "$keychain"
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Check each app's architecture, signature, and hardened runtime, and each dmg's signature
        working-directory: client/packages/desktop/release
        run: |
          signed_by_us() {
            details="$(codesign -dvv "$1" 2>&1)"
            echo "$details" | grep -q '^Authority=Developer ID Application: Jacob Kiesel (L2GS25U79G)$' \
              || { echo "$1 is not signed with the Developer ID Application identity"; exit 1; }
            echo "$details" | grep -q '^Timestamp=' || { echo "$1's signature has no timestamp"; exit 1; }
          }
          for pair in mac-arm64:arm64 mac:x86_64; do
            app="${pair%%:*}/Aspen.app"
            # One architecture a call: Xcode 27's lipo takes no more.
            lipo "$app/Contents/MacOS/Aspen" -verify_arch "${pair##*:}" \
              || { echo "$app is not built for ${pair##*:}"; exit 1; }
            for arch in arm64 x86_64; do
              lipo "$app/Contents/Resources/aspen-capture" -verify_arch "$arch" \
                || { echo "$app's capture helper is not built for $arch"; exit 1; }
            done
            codesign --verify --deep --strict --verbose=2 "$app"
            for file in "$app" "$app/Contents/Resources/aspen-capture"; do
              signed_by_us "$file"
              codesign -dvv "$file" 2>&1 | grep -q 'flags=.*runtime' || { echo "$file lacks the hardened runtime"; exit 1; }
            done
          done
          for dmg in *.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            signed_by_us "$dmg"
          done
      - name: Send the dmgs to the notary service
        working-directory: client/packages/desktop/release
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notarization.p8"
          echo '[]' > submissions.json
          for dmg in *.dmg; do
            id="$(xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notarization.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json | jq -r .id)"
            echo "$dmg: submission $id"
            jq --arg dmg "$dmg" --arg id "$id" '. + [{dmg: $dmg, id: $id}]' submissions.json > submissions.next
            mv submissions.next submissions.json
          done
          rm "$RUNNER_TEMP/notarization.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # `notarized-dmg.yml` finds this by its name.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-unstapled
          path: |
            client/packages/desktop/release/*.dmg
            client/packages/desktop/release/submissions.json

  # The app and its UI tests built for the simulator, unsigned, and the extension's Web Push
  # decryption checked against RFC 8291's example. The UI tests themselves need a deployment
  # (`client/docs/architecture/ios-app.md`), which these runners cannot hold.
  ios:
    name: iOS — simulator build and Web Push check
    needs: schemas
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the iOS project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync ios
      - run: xcodebuild -version
      - name: Build the app and its UI tests for the simulator
        working-directory: client/packages/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - run: packages/mobile/ios/scripts/check_webpush.sh

  # An App Store build, signed by hand (`app_store.py`), for `main` alone, from the
  # `apple-signing` environment's secrets. It is sent to App Store Connect as a TestFlight build
  # only while the repository variable `TESTFLIGHT_UPLOAD` is `true`; otherwise the signed `.ipa`
  # is exported and kept, which shows the signing still works.
  ios-testflight:
    name: iOS — App Store build for TestFlight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios
    environment: apple-signing
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the iOS project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync ios
      - name: The certificate, the profiles, and the App Store Connect key
        run: |
          printf '%s' "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$IOS_PROFILE_NOTIFICATIONS" | base64 --decode > "$RUNNER_TEMP/notifications.mobileprovision"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/app-store-connect.p8"
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_NOTIFICATIONS: ${{ secrets.IOS_PROFILE_NOTIFICATIONS }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # The build number grows with every run and every attempt of one, as App Store Connect
      # requires of the builds of one version.
      - name: Archive, sign, and export${{ vars.TESTFLIGHT_UPLOAD == 'true' && ' and upload' || '' }}
        run: |
          packages/mobile/ios/scripts/app_store.py \
            --certificate "$RUNNER_TEMP/distribution.p12" \
            --profile "$RUNNER_TEMP/app.mobileprovision" \
            --profile "$RUNNER_TEMP/notifications.mobileprovision" \
            --build-number "${{ github.run_number }}.${{ github.run_attempt }}" \
            --relay "$ASPEN_PUSH_RELAY" \
            --api-key "$RUNNER_TEMP/app-store-connect.p8" \
            --api-key-id "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER" \
            ${{ vars.TESTFLIGHT_UPLOAD == 'true' && '--upload' || '' }}
        env:
          ASPEN_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          ASPEN_PUSH_RELAY: ${{ vars.ASPEN_PUSH_RELAY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: vars.TESTFLIGHT_UPLOAD != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-store
          path: target/ios-app-store/*.ipa

  desktop-flatpak:
    name: Desktop (Linux) — Flatpak
    needs: schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # librsvg2-common is the SVG loader appstreamcli compose reads the app's icon with; it is
      # only recommended, and without it the build fails with `file-read-error`.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common \
            pkg-config libpipewire-0.3-dev libopus-dev libclang-dev
      # Flatpak builds and runs in sandboxes made with user namespaces, which the runner's
      # AppArmor keeps from programs it has no profile for.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # What `packages/desktop/flatpak/com.aspen_chat.client.yml` builds on and runs in.
      - name: Flatpak runtime, SDK, and base app
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/packages/desktop/native/capture
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm --filter @aspen/desktop package:flatpak
      # The capture helper answering inside the sandbox shows that the app's files are where
      # the launcher expects them and that the runtime has the libraries the helper links.
      - name: Install it, and ask the capture helper what it can capture
        working-directory: client/packages/desktop/release/flatpak
        run: |
          flatpak install --user --noninteractive ./Aspen-*.flatpak
          echo '{"type":"kinds","id":1}' \
            | flatpak run --command=/app/aspen/resources/aspen-capture com.aspen_chat.client \
            | grep '"type":"kinds"'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-flatpak
          path: client/packages/desktop/release/flatpak/*.flatpak

  android:
    name: Android — build, unit, and device tests, and the APK
    needs: schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: schemas
          path: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # Capacitor 8's Android build wants JDK 21; the runner already has the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The Open Source Attributions list is made from `cargo metadata` when the app is built
      # or served (`client/packages/app/attributions/plugin.ts`).
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Build the web shell and copy it into the Android project
        run: |
          pnpm --filter @aspen/app build:shell
          cd packages/mobile && npx cap sync android
      - name: Build and unit test
        working-directory: client/packages/mobile/android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug
        env:
          ASPEN_BUILD_NUMBER: ${{ github.run_number }}
          ASPEN_BUILD_COMMIT: ${{ github.sha }}
      # Kept before the device tests run, so a failing emulator still leaves the APK to install.
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-debug
          path: client/packages/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # The push handler's test posts and cancels real notifications, so it runs on an emulator,
      # which the runner accelerates with KVM once its device node is opened to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/packages/mobile/android
          script: ./gradlew --console=plain :app:connectedDebugAndroidTest

  federation-and-push:
    name: Federation and push — two deployments over TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev openssl python3-pip
          pip install cryptography
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: federation-and-push
      - run: cargo build --locked -p aspen-chat-server -p aspen-migrate
      - name: Start both deployments
        run: python3 scripts/dev_federation.py up --start-services
      - name: Federation between them
        run: python3 scripts/dev_federation.py check
      - name: Waking phones
        run: python3 scripts/dev_push.py
      - name: Server logs
        if: failure()
        run: tail -n 200 target/dev-federation/*/server.log

  deploy-configurations:
    name: Deployment configurations — OpenTofu tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu fmt -check -recursive deploy
      # Each plans against made-up providers, so it needs no AWS account.
      - name: Validate and test each
        run: |
          for configuration in deploy/aws deploy/aws-single; do
            tofu -chdir="$configuration" init -backend=false -input=false
            tofu -chdir="$configuration" validate
            tofu -chdir="$configuration" test
          done

  box:
    name: The box — start, upgrade, restore, export
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The images workflow's cache for this architecture, read but not written: a pull
      # request's build is not one to build from.
      - name: api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: api
          load: true
          tags: aspen-api:check
          cache-from: type=gha,scope=image-amd64
      - name: voice image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: voice
          load: true
          tags: aspen-voice:check
          cache-from: type=gha,scope=image-amd64
      - run: python3 scripts/check_box.py --api-image aspen-api:check --voice-image aspen-voice:check

  arm64-native:
    name: ARM64 (Debian 12) — build and test natively
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 90
    # The second-factor failure limit's tests count attempts in a real Valkey, which a job in a
    # container reaches by its service's name.
    services:
      valkey:
        image: valkey/valkey:alpine
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      JEMALLOC_SYS_WITH_LG_PAGE: "16"
      VALKEY_URL: redis://valkey:6379
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libssl-dev libpq-dev python3 python3-pip python3-venv binutils
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-bookworm
      - run: cargo build --locked --release -p aspen-chat-server -p voice_server -p aspen-migrate
      - run: cargo test --locked --release --workspace
      - name: Check the binaries (architecture, glibc, start-up, jemalloc's page size)
        run: python3 scripts/cross_aarch64.py check --dir target/release
      - name: Package
        run: |
          mkdir dist
          cp target/release/aspen-chat-server target/release/voice_server target/release/aspen-migrate dist/
          tar -C dist -czf aspen-aarch64-bookworm.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-aarch64-bookworm
          path: aspen-aarch64-bookworm.tar.gz

  arm64-cross:
    name: ARM64 (Debian 12) — cross-compile on x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config python3-pip
      - name: Rust (the toolchain rust-toolchain.toml pins, with its targets)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-cross
          cache-directories: target/cross
      - name: Set up, build, and check
        run: python3 scripts/cross_aarch64.py
      - name: Package
        run: |
          mkdir dist
          for binary in aspen-chat-server voice_server aspen-migrate; do
            cp "target/aarch64-unknown-linux-gnu/release/$binary" dist/
          done
          tar -C dist -czf aspen-aarch64-bookworm-cross.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-aarch64-bookworm-cross
          path: aspen-aarch64-bookworm-cross.tar.gz

  arm64-smoke:
    name: ARM64 — servers start and serve (${{ matrix.build }})
    needs: [arm64-native, arm64-cross]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [aspen-aarch64-bookworm, aspen-aarch64-bookworm-cross]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.build }}
      - name: Unpack
        run: mkdir dist && tar -C dist -xzf "${{ matrix.build }}.tar.gz"
      - name: Start the services, then the servers, and use them
        run: python3 scripts/smoke_servers.py --bin dist --start-services
