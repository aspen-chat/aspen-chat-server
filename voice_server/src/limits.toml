# A voice server's built-in limits. The `[rate_limits]` of `voice_server.toml` (or its
# `ASPEN_VOICE_SERVER_RATE_LIMITS__…` environment variables) is laid over them: a limit given
# there replaces the built-in one for the same place and dimension whole, `false` removes it,
# and everything else keeps its value here. `limits.rs` describes the model.
#
# A limit is `{ requests, per_seconds, burst?, bucket? }`, as in the API server's
# `rate_limits.toml`: `requests` spread evenly over `per_seconds`, up to `burst` back to back
# (`requests` when omitted), and limits naming the same `bucket` share one budget.
#
# `http` limits its two routes, `health` (the latency probe) and `signalling` (opening the
# socket), along `ip` and `global`. `frames` limits signalling frames by type (their `type` on
# the wire, `createTransport` for instance, or `any` for every frame) along `user` (one caller,
# on this server), `ip`, `channel` (one call, whoever sends), and `global`.

[rate_limits]
enabled = true
# Reverse proxies whose X-Forwarded-For is believed, as addresses or CIDR networks.
trusted_proxies = []
ipv6_prefix = 64
# The longest this server honours a suspension of its limits (the API server's
# `limits suspend`), counted from when it started: a day.
max_suspension_seconds = 86400
# The largest signalling message taken, in bytes. The biggest a client sends are its RTP
# capabilities, a few kilobytes.
max_message_bytes = 262144
# Sockets one address may hold open before they identify.
max_pending_sockets_per_ip = 8
# Connections the HTTP listener holds at once, signalling sockets included; past it, new ones
# wait to be accepted. Each is a file descriptor, so the process's limit (`ulimit -n`) must
# allow this many and mediasoup's own besides.
max_connections = 10000
# Calls one user may be in at once on this server, each holding transports and so ports from
# the media range: a second leaves room for a device joining one call while another leaves.
# Joining the same call again from another socket replaces the first and takes no more.
max_seats_per_user = 2
# People one call may hold at once, so no single call takes the whole media range.
max_participants_per_call = 500

[rate_limits.http.health]
# Clients probe every candidate when they join a call; a whole office may share the address.
ip = { requests = 120, per_seconds = 60, burst = 30 }

[rate_limits.http.signalling]
ip = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.frames.any]
# Joining a big call resumes one consumer per producer already in it.
user = { requests = 50, per_seconds = 1, burst = 400 }

# Joining a call takes one `identify`, `setCapabilities`, `produce`, and `setState`, and two
# `createTransport` and `connectTransport`. Their limits let someone moving from call to call
# join a dozen times back to back, and every two seconds or so after that.
[rate_limits.frames.identify]
user = { requests = 30, per_seconds = 60, burst = 12 }

[rate_limits.frames.setCapabilities]
user = { requests = 30, per_seconds = 60, burst = 12 }

# Each transport takes ports from the media range. A participant holds one in each direction
# (a second send transport is refused; a new receive transport replaces the last), and leaving
# closes both, so moving between calls churns
# transports rather than piling them up.
[rate_limits.frames.createTransport]
user = { requests = 60, per_seconds = 60, burst = 24 }
# A whole office may share an address. The server's own limit bounds how fast the range can be
# churned whatever the number of accounts.
ip = { requests = 240, per_seconds = 60, burst = 96 }
global = { requests = 6000, per_seconds = 60, burst = 1200 }

[rate_limits.frames.connectTransport]
user = { requests = 60, per_seconds = 60, burst = 24 }

[rate_limits.frames.produce]
user = { requests = 40, per_seconds = 60, burst = 20 }

[rate_limits.frames.produceRtp]
user = { requests = 10, per_seconds = 60, burst = 4 }
ip = { requests = 40, per_seconds = 60, burst = 16 }
global = { requests = 1200, per_seconds = 60, burst = 300 }

# Each takes a port from the media range too.
[rate_limits.frames.consumeRtp]
user = { requests = 10, per_seconds = 60, burst = 4 }
ip = { requests = 40, per_seconds = 60, burst = 16 }
global = { requests = 1200, per_seconds = 60, burst = 300 }

[rate_limits.frames.closeProducer]
user = { requests = 30, per_seconds = 60, burst = 10 }

# Only a `setState` that unmutes or undeafens counts: one that mutes or deafens, and lifts
# neither, always goes through (`Rooms::quietens`), so no one can be kept audible. Each is
# reported to the API server and announced to everyone who can see the call; since every mute
# must be undone by a limited frame before it can be repeated, this limit bounds both. There is
# no `channel` limit: others' frames must never spend someone's own.
[rate_limits.frames.setState]
user = { requests = 40, per_seconds = 60, burst = 20 }

# File transfers. An offer and an acceptance are announced to everyone in the call.
[rate_limits.frames.offerFile]
user = { requests = 20, per_seconds = 60, burst = 5 }
channel = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.frames.withdrawFile]
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.frames.acceptFile]
user = { requests = 30, per_seconds = 60, burst = 10 }
channel = { requests = 120, per_seconds = 60, burst = 30 }

# A peer connection's offer, answer, and candidates: a few dozen frames per transfer, each at
# most 32 KiB, so a burst stays far inside the other side's 8 MiB outbox.
[rate_limits.frames.transferSignal]
user = { requests = 600, per_seconds = 60, burst = 60 }

[rate_limits.frames.endTransfer]
user = { requests = 60, per_seconds = 60, burst = 20 }
