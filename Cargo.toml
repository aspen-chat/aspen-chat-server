[workspace]
resolver = "2"
members = ["server", "message_gen", "migrate", "voice_protocol", "voice_server", "limits", "metrics", "bench_protocol", "bench"]
# The desktop shell's libobs addon links libobs, which nothing else needs; it is its own
# workspace and built by `pnpm build:native` in client/packages/desktop. The example plugin is
# built for `wasm32-wasip2` and is its own workspace too.
exclude = ["client/packages/desktop/native/obs-capture", "plugins/word_filter"]
default-members = ["server"]
