[workspace]
resolver = "2"
members = ["server", "server/app", "server/api", "server/previews", "server/schema", "server/database", "server/locale", "server/wire", "server/plugin_runtime", "server/outbound", "server/link_preview", "server/search_text", "server/webpush", "server/federation_core", "server/email_templates", "message_gen", "migrate", "voice_protocol", "voice_server", "limits", "config_values", "tls", "sockets", "metrics", "bench_protocol", "bench", "voice_media"]
# The desktop shell's libobs addon links libobs, which nothing else needs; it is its own
# workspace and built by `pnpm build:native` in client/packages/desktop. The example plugins are
# built for `wasm32-wasip2`, each its own workspace too.
exclude = [
  "client/packages/desktop/native/capture",
  "plugins/word_filter",
  "plugins/forum",
  "plugins/calendar",
]
default-members = ["server"]
