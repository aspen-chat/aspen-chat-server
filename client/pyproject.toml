[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aspen-chat-client"
version = "0.1.0"
description = "Qt for Python desktop client for Aspen chat server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "PySide6>=6.7.0",
    "qasync>=0.28.0",
    "qtawesome>=1.3.1",
    "tenacity>=9.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.30.0",
]

[project.scripts]
aspen-client = "aspen_client.main:main"
generate-client = "aspen_client.codegen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
