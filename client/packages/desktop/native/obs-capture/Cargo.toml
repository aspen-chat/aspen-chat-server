[package]
name = "aspen_obs_capture"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Helper process for the Aspen desktop shell: captures a game or window with libobs and streams H.264 packets to the shell"
publish = false

# Its own workspace: it links libobs, which the rest of the repository must not need in order
# to build, so it is excluded from the root workspace and built by `pnpm build:native` in
# packages/desktop.
[workspace]

[[bin]]
name = "aspen-obs-capture"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
rand = "0.9"
rtcp = "0.17"
rtp = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webrtc-srtp = "0.17"
webrtc-util = "0.17"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.1"
