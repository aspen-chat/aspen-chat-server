# Packaging for the desktop shell. Run `pnpm package` (all platforms the host can build) or
# `pnpm package:dir` for an unpacked directory to inspect.
appId: org.aspenchat.client
productName: Aspen
copyright: "GPL-3.0-or-later"
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The renderer: the @aspen/app production build, loaded from `resources/app/index.html`.
  - from: ../app/dist
    to: app
  # The libobs capture helper, built by `pnpm build:native` (`aspen-obs-capture.exe` on Windows).
  - from: native
    to: .
    filter:
      - aspen-obs-capture
      - aspen-obs-capture.exe
  # The window's icon on Linux, where a window names its own; `build/` holds every platform's
  # icons, drawn by `client/scripts/export_icons.py`.
  - from: build/icons/512x512.png
    to: icon.png
asar: true
# The `aspen://app/…` links invites and sign-in codes are shared as where a deployment names no
# web client: registered with the system by each installer (the Linux packages' desktop entry,
# macOS's Info.plist, and Windows's registry), and claimed again at run time (`appLinks.ts`).
protocols:
  - name: Aspen
    schemes:
      - aspen
npmRebuild: false
linux:
  # The package's own name, `@aspen/desktop`, is no file name.
  executableName: aspen
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Network
mac:
  icon: build/icon-mac.png
  target:
    - dmg
  category: public.app-category.social-networking
  # Signed under the hardened runtime, as notarization requires, with what calls and the
  # capture helper need allowed (`build/entitlements.mac.plist`), and the reasons macOS shows
  # when it asks for the microphone, the camera, and the screen.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Aspen uses the microphone in voice calls.
    NSCameraUsageDescription: Aspen shows your camera to a call when you turn it on.
    NSScreenCaptureUsageDescription: Aspen shares a screen or window with a call when you choose one.
win:
  icon: build/icon.ico
  target:
    - nsis
  # The libobs the helper uses, the OBS Project's own signed release files as
  # `scripts/fetch-libobs.mjs` lays them out (`pnpm fetch:libobs` before packaging).
  extraResources:
    - from: native/libobs
      to: libobs
      filter:
        - bin/**
        - obs-plugins/**
        - data/**
        - VERSION
