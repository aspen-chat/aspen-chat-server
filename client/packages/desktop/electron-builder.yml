# Packaging for the desktop shell. Run `pnpm package` (all platforms the host can build) or
# `pnpm package:dir` for an unpacked directory to inspect.
appId: org.aspenchat.client
productName: Aspen
copyright: "GPL-3.0-or-later"
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The renderer: the @aspen/app production build, loaded from `resources/app/index.html`.
  - from: ../app/dist
    to: app
  # The libobs capture helper, built by `pnpm build:native` (`aspen-obs-capture.exe` on Windows).
  - from: native
    to: .
    filter:
      - aspen-obs-capture
      - aspen-obs-capture.exe
  # The window's icon on Linux, where a window names its own; `build/` holds every platform's
  # icons, drawn by `client/scripts/export_icons.py`.
  - from: build/icons/512x512.png
    to: icon.png
asar: true
npmRebuild: false
linux:
  # The package's own name, `@aspen/desktop`, is no file name.
  executableName: aspen
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Network
mac:
  icon: build/icon-mac.png
  target:
    - dmg
  category: public.app-category.social-networking
win:
  icon: build/icon.ico
  target:
    - nsis
