[package]
name = "aspen-chat-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.4", features = ["macros", "ws"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.37", features = ["derive"] }
ctrlc = { version = "3.4.6", features = ["termination"] }
diesel = { version = "2.2.10", features = ["uuid", "chrono", "postgres", "r2d2", "serde_json"] }
directories-next = "2.0.0"
futures-util = "0.3.31"
rcgen = "0.14.7"
ring = "0.17.14"
rustls = "0.23.26"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["io-util", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1.41"
tracing-panic = "0.1.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }

message_gen = { path = "../message_gen" }
voice_protocol = { path = "../voice_protocol" }
rand = "0.10.0"
rand_chacha = "0.10.0"
base64 = "0.22.1"
diesel-async = { version = "0.7.4", features = ["deadpool", "postgres", "r2d2"] }
hyper = { version = "1.6.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.12", features = ["http1", "http2", "server", "server-auto", "server-graceful"] }
tower = { version = "0.5.2", features = ["tokio", "tracing"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tokio-rustls = "0.26.2"
async-nats = { version = "0.46.0", features = ["aws-lc-rs", "jetstream", "kv", "server_2_10", "server_2_11"], default-features = false }
bytes = "1.10.1"
config = { version = "0.15.14", features = ["toml"] }
rust-i18n = "3.1.5"
heck = "0.5.0"
thiserror = "2.0.18"
anyhow = "1.0.102"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid", "yaml"] }
utoipa-axum = "0.2.0"
serde_norway = "0.9.42"
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
log = "0.4.27"
time = "0.3.47"
tungstenite = "0.28.0"
vecmap-rs = "0.2.4"
emojis = "0.8.0"
fred = { version = "10.1.0", features = ["i-config", "i-scripts"] }
aws-config = "1.8.8"
aws-sdk-s3 = "1.106.0"
aws-credential-types = "1.2.8"
aws-types = "1.3.9"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "http2", "json"] }
pulldown-cmark = { version = "0.13.3", default-features = false }
html5ever = "0.39.0"
url = "2.5.8"
lru = "0.17.0"
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "conditional-ui"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.9"
subtle = "2.6"
aspen_limits = { version = "0.1.0", path = "../limits" }
aspen_metrics = { version = "0.1.0", path = "../metrics", features = ["jemalloc"] }
# The global allocator, replacing malloc for the whole process (C and C++ libraries included),
# so its statistics describe all of the process's memory.
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }
metrics = "0.24"
aspen_bench_protocol = { version = "0.1.0", path = "../bench_protocol" }
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
humantime = "2.4.0"
bitflags = "2.13.2"
console-subscriber = { version = "0.5.0", optional = true }
imagesize = "0.15.0"
regex = "1.13.1"
# Plugins (`app::plugin`): WebAssembly components run in a sandbox, metered and bounded. The
# WASI host gives a component built for `wasm32-wasip2` the system interfaces its standard
# library imports, with nothing behind them: no files, sockets, environment, or arguments.
wasmtime = { version = "49.0.2", default-features = false, features = ["async", "cranelift", "component-model", "runtime", "std", "pooling-allocator", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }

[dev-dependencies]
serde_urlencoded = "0.7.1"

[features]
# tokio-console (https://github.com/tokio-rs/console) for development: build with
# RUSTFLAGS="--cfg tokio_unstable" cargo build --features console, then run `tokio-console`.
console = ["dep:console-subscriber", "tokio/tracing"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
