[package]
name = "aspen-chat-server"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.37", features = ["derive"] }
ctrlc = { version = "3.4.6", features = ["termination"] }
diesel = { version = "2.2.10", features = ["uuid", "chrono", "postgres", "r2d2", "serde_json"] }
directories-next = "2.0.0"
futures-util = "0.3.31"
rcgen = "0.14.7"
rustls = "0.23.26"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1.41"
tracing-panic = "0.1.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["serde", "v7"] }
diesel-async = { version = "0.7.4", features = ["deadpool", "postgres", "r2d2"] }
hyper = { version = "1.6.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.12", features = ["http1", "http2", "server", "server-auto", "server-graceful"] }
tower = { version = "0.5.2", features = ["tokio", "tracing"] }
tokio-rustls = "0.26.2"
async-nats = { version = "0.46.0", features = ["aws-lc-rs", "jetstream", "kv", "server_2_10", "server_2_11"], default-features = false }
anyhow = "1.0.102"
log = "0.4.27"
time = "0.3.47"
aspen_limits = { version = "0.1.0", path = "../limits" }
voice_protocol = { path = "../voice_protocol" }
aspen_metrics = { version = "0.1.0", path = "../metrics", features = ["jemalloc"] }
# The global allocator, replacing malloc for the whole process (C and C++ libraries included),
# so its statistics describe all of the process's memory.
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }
aspen_schema = { version = "0.1.0", path = "schema" }
aspen_bench_protocol = { version = "0.1.0", path = "../bench_protocol" }
humantime = "2.4.0"
console-subscriber = { version = "0.5.0", optional = true }
aspen_app = { version = "0.1.0", path = "app" }
aspen_wire = { version = "0.1.0", path = "wire", features = ["clap"] }
aspen_api = { version = "0.1.0", path = "api" }

[features]
# tokio-console (https://github.com/tokio-rs/console) for development: build with
# RUSTFLAGS="--cfg tokio_unstable" cargo build --features console, then run `tokio-console`.
console = ["dep:console-subscriber", "tokio/tracing"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
