[package]
name = "aspen-svg-render"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Draws one SVG attachment as pixels for its preview, in a process of its own under the limits the API server sets and a seccomp filter of its own."

[lib]
name = "aspen_svg_render"

[[bin]]
name = "aspen-svg-render"
required-features = ["render"]

[features]
default = ["render"]
# The renderer itself. Without it the crate is only its protocol, which the API server's
# previews speak.
render = ["dep:resvg", "dep:memmap2", "dep:flate2", "dep:imagesize", "dep:seccompiler", "dep:libc"]

[dependencies]
# Without its system fonts (fontconfig) or file access: every font is the directory given to it.
resvg = { version = "0.50.0", optional = true, default-features = false, features = ["text", "raster-images"] }
memmap2 = { version = "0.9.12", optional = true }
# Unpacking SVGZ within a limit, which usvg's own unpacking has none of.
flate2 = { version = "1.1.9", optional = true }
# Reading an embedded picture's size from its header, as usvg does, before it is decoded.
imagesize = { version = "0.15.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5.0", optional = true }
libc = { version = "0.2.190", optional = true }

[dev-dependencies]
# The server's side of the protocol, run against this program in `tests/previews.rs`.
aspen_previews = { path = "../previews" }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
image = { version = "0.25.10", default-features = false, features = ["webp"] }
base64 = "0.22.1"
png = "0.18.1"
