[package]
name = "aspen_app"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The API server's business logic: permissions, each endpoint's operations, the database and the events published for them, and the background work every server shares."

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.10", features = ["uuid", "chrono", "postgres", "r2d2", "serde_json"] }
futures-util = "0.3.31"
aws-lc-rs = "1.13"
rustls = "0.23.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["serde", "v7"] }
voice_protocol = { path = "../../voice_protocol" }
rand = "0.10.0"
rand_chacha = "0.10.0"
base64 = "0.22.1"
diesel-async = { version = "0.7.4", features = ["deadpool", "postgres", "r2d2"] }
# The pool diesel-async builds on, for its Tokio timer: without one it cannot time out a wait.
deadpool = { version = "0.12.2", default-features = false, features = ["managed", "rt_tokio_1"] }
async-nats = { version = "0.50.0", features = ["aws-lc-rs", "jetstream", "kv", "server_2_10", "server_2_11"], default-features = false }
bytes = "1.10.1"
config = { version = "0.15.14", features = ["toml"] }
rust-i18n = "3.1.5"
thiserror = "2.0.18"
anyhow = "1.0.102"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid", "yaml"] }
serde_norway = "0.9.42"
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
time = "0.3.47"
vecmap-rs = "0.2.4"
emojis = "0.8.0"
fred = { version = "10.1.0", features = ["i-config", "i-scripts", "enable-rustls"] }
# Without their default features, which add a second, older rustls and hyper, SigV4a's
# elliptic curves, and AWS SSO sign-in, none of which a bucket reached with a static key needs.
aws-config = { version = "1.8.8", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.106.0", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
# The S3 client's HTTPS client, made here when `[media.s3.tls]` adds authorities to trust.
aws-smithy-http-client = { version = "1.1.10", features = ["rustls-aws-lc"] }
aws-credential-types = "1.2.8"
aws-types = "1.3.9"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "http2", "json"] }
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
url = "2.5.8"
lru = "0.17.0"
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "conditional-ui"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.9"
subtle = "2.6"
aspen_limits = { version = "0.1.0", path = "../../limits" }
aspen_metrics = { version = "0.1.0", path = "../../metrics", features = ["jemalloc"] }
metrics = "0.24"
aspen_previews = { version = "0.1.0", path = "../previews" }
aspen_schema = { version = "0.1.0", path = "../schema" }
aspen_locale = { version = "0.1.0", path = "../locale" }
aspen_wire = { version = "0.1.0", path = "../wire" }
aspen_plugin_runtime = { version = "0.1.0", path = "../plugin_runtime" }
aspen_outbound = { version = "0.1.0", path = "../outbound" }
aspen_database = { version = "0.1.0", path = "../database" }
aspen_tls = { version = "0.1.0", path = "../../tls" }
aspen_link_preview = { version = "0.1.0", path = "../link_preview" }
aspen_webpush = { version = "0.1.0", path = "../webpush" }
aspen_federation_core = { version = "0.1.0", path = "../federation_core" }
aspen_email_templates = { version = "0.1.0", path = "../email_templates" }
aspen_bench_protocol = { version = "0.1.0", path = "../../bench_protocol" }
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
imagesize = "0.15.0"
regex = "1.13.1"
# Usernames: whether a name is in NFC, and its UTS #39 confusable skeleton, so no name passes
# for the system account's by letters that look alike.
unicode-normalization = "0.1.24"
unicode-security = "0.1.2"
# Plugins (`app::plugin`): WebAssembly components run in a sandbox, metered and bounded. The
# WASI host gives a component built for `wasm32-wasip2` the system interfaces its standard
# library imports, with nothing behind them: no files, sockets, environment, or arguments.
wasmtime = { version = "49.0.2", default-features = false, features = ["async", "cranelift", "component-model", "runtime", "std", "pooling-allocator", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "hostname", "pool", "aws-lc-rs"] }
askama = "0.16.1"
chrono-tz = "0.10.4"
tempfile = "3.27.0"
moka = { version = "0.12", features = ["sync"] }
