# Aspen's built-in rate limits. The `[rate_limits]` of `aspen.toml` is laid over them: a limit
# given there replaces the built-in one for the same place and dimension whole (a limit written
# without `burst` has the default burst, not the built-in one's), and everything else keeps its
# value here. `app::rate_limit` describes the model.
#
# Every endpoint has the `default` limits, where they apply, plus those of each group listing
# it; its own `endpoints` entry replaces its groups' limits dimension by dimension. Setting a
# dimension to `false` on a group or endpoint removes it there, the default's included; in
# `default` it removes the built-in default.
#
# A limit is `{ requests, per_seconds, burst?, bucket? }`: `requests` spread evenly over
# `per_seconds`, with up to `burst` of them allowed back to back (`requests` when omitted).
# Requests counted in the same `bucket` share one budget; without a bucket each endpoint counts
# on its own.
#
# Dimensions say whose requests count together:
#   global            everyone's
#   ip                one client address (an IPv6 address's /ipv6_prefix network)
#   user              one signed-in user (authenticated endpoints only)
#   username          one username given to `POST /auth/login`, from one network (an IPv4
#                     /24, an IPv6 /48 or the coarser ipv6_prefix)
#   username_failures one username's wrong passwords at `POST /auth/login`, from anywhere:
#                     looked at before the password is checked, counted after a wrong one
#   per_<param>       everyone's, per value of the path parameter, e.g. per_channel
#   user_per_<param>  one user's, per value of the path parameter, e.g. user_per_channel
#   ip_per_<param>    one address's, per value of the path parameter
# A path parameter's value is counted as its endpoint reads it: an id in any spelling the API
# accepts (with or without hyphens, braces, `urn:uuid:`, any case) is one value. Valkey holds
# each value, and each username, only as its SHA-256.
#
# Endpoints are named by method and path template without `/api/v1`, as in the OpenAPI
# document, plus `GET /events` for the event stream, `GET /auth/passkey` for the passkey page,
# `GET /.well-known/aspen` for the federation document, `GET` and `POST /email/unsubscribe`
# for the page unsubscribe links open, and `GET /invite/{code}` and `GET /{*path}` for the web
# client's pages (all but the first served at those paths, outside `/api/v1`). The pages
# check their own limits and are served, over them, without what they preview as; the web
# client's files are not limited. A request using a method its path does not have, which is
# refused, still counts toward the `default` limits that need no session or path parameter;
# a method that is not a standard HTTP one is named `OTHER`.

[rate_limits]
enabled = true
# Reverse proxies whose X-Forwarded-For is believed, as addresses or CIDR networks.
trusted_proxies = []
ipv6_prefix = 64
# The longest this server honours a suspension of its limits (`limits suspend`), counted from
# when it started, whatever the suspension says: a day.
max_suspension_seconds = 86400
# Endpoints refused (`503` `serverBusy`) rather than let through while Valkey cannot be reached
# to count their limits: everything that guesses a password, a code, or an invite. Every other
# endpoint is let through then. The username limits of `POST /auth/login` are always refused so.
fail_closed = [
  "GET /auth/passkey",
  "POST /auth/login",
  "POST /auth/login/second-factor",
  "POST /auth/federated-sign-in",
  "POST /auth/passkey-ceremonies",
  "GET /auth/passkey-ceremonies/{ceremony}",
  "POST /auth/passkey-ceremonies/{ceremony}/credential",
  "POST /auth/passkey-ceremonies/{ceremony}/claim",
  "POST /auth/device-links",
  "POST /auth/device-links/{link}/scan",
  "GET /auth/device-links/{link}",
  "POST /auth/device-links/{link}/claim",
  "POST /auth/password-resets",
  "POST /auth/password-resets/{reset}/codes",
  "POST /auth/password-resets/{reset}/completion",
  "POST /users",
  "GET /registration-invites/{code}",
  "GET /invites/{code}",
  "GET /invite/{code}",
  "PUT /communities/{community}/members/@me",
  "POST /communities/{community}/invites",
]

# Applies to every endpoint, beneath any group or endpoint setting.
[rate_limits.default]
# Everything one user does, across the whole API. Generous: the client fetches in bursts when
# it starts and when it meets unknown users.
user = { requests = 1200, per_seconds = 60, burst = 300, bucket = "api" }
# Everything from one address, signed in or not; many people may share one address.
ip = { requests = 3000, per_seconds = 60, burst = 600, bucket = "api" }

# What a stranger can call to get in: tight per address.
[rate_limits.groups.sign_in]
endpoints = [
  "GET /auth/passkey",
  "POST /auth/login",
  "POST /auth/login/second-factor",
  "POST /auth/federated-sign-in",
  "POST /auth/passkey-ceremonies",
  "GET /auth/passkey-ceremonies/{ceremony}",
  "POST /auth/passkey-ceremonies/{ceremony}/credential",
  "POST /auth/passkey-ceremonies/{ceremony}/claim",
  "POST /auth/device-links",
  "POST /auth/device-links/{link}/scan",
  "POST /auth/password-resets",
  "POST /auth/password-resets/{reset}/codes",
  "POST /auth/password-resets/{reset}/completion",
]
limits = { ip = { requests = 30, per_seconds = 60, burst = 10, bucket = "sign_in" } }

# Asked every couple of seconds while a sign-in code shows (`app::device_link`), for a minute
# at most; counted per code, so a device making codes one after another is held by the
# `sign_in` limit on making them.
[rate_limits.groups.device_link_polling]
endpoints = [
  "GET /auth/device-links/{link}",
  "POST /auth/device-links/{link}/claim",
]
limits = { ip_per_link = { requests = 60, per_seconds = 60, burst = 10 } }

# Changing how an account signs in.
[rate_limits.groups.security]
endpoints = [
  "POST /auth/reauthenticate",
  "PUT /users/{user}/password",
  "DELETE /users/{user}",
  "POST /users/{user}/totp",
  "DELETE /users/{user}/totp",
  "POST /users/{user}/totp/confirmation",
  "PATCH /users/{user}/passkeys/{passkey}",
  "DELETE /users/{user}/passkeys/{passkey}",
  "POST /users/{user}/recovery-codes",
  "DELETE /users/{user}/sign-ins",
  "PUT /users/{user}/email/address",
  "DELETE /users/{user}/email/address",
  "POST /users/{user}/email/verification",
]
limits = { user = { requests = 20, per_seconds = 600, burst = 10, bucket = "security" } }

# Starting and finishing uploads to object storage.
[rate_limits.groups.uploads]
endpoints = ["POST /attachments", "POST /attachments/{attachment}/confirm", "POST /icons", "POST /icons/{icon}/confirm"]
limits = { user = { requests = 60, per_seconds = 600, burst = 20, bucket = "uploads" } }

# The Administration Dashboard, kept to a pace a person clicking through it never reaches.
[rate_limits.groups.admin]
endpoints = [
  "GET /admin/overview",
  "GET /admin/users",
  "GET /admin/communities",
  "GET /admin/registration-invites",
  "POST /admin/registration-invites",
  "DELETE /admin/registration-invites/{code}",
  "GET /admin/fleet",
  "GET /admin/growth",
  "GET /admin/roles",
  "POST /admin/roles",
  "PATCH /admin/roles/{role}",
  "DELETE /admin/roles/{role}",
  "PUT /admin/role-order",
  "PUT /admin/users/{user}/roles/{role}",
  "DELETE /admin/users/{user}/roles/{role}",
  "GET /admin/moderation-log",
  "GET /admin/jobs",
  "GET /admin/users/{user}/dms",
  "PUT /admin/users/{user}/ban",
  "DELETE /admin/users/{user}/ban",
  "GET /admin/reports",
  "GET /admin/report-counts",
  "GET /admin/reports/{case}",
  "GET /admin/reports/{case}/context",
  "POST /admin/reports/{case}/resolution",
  "PUT /admin/reports/{case}/dismissal",
  "DELETE /admin/reports/{case}/dismissal",
  "GET /admin/report-categories",
  "POST /admin/report-categories",
  "PATCH /admin/report-categories/{category}",
  "PUT /admin/report-category-order",
  "GET /admin/federation",
  "GET /admin/federation/deployments",
  "POST /admin/federation/deployments",
  "GET /admin/federation/deployments/{domain}",
  "PATCH /admin/federation/deployments/{domain}",
  "DELETE /admin/federation/deployments/{domain}",
  "POST /admin/federation/deployments/{domain}/contact",
  "PUT /admin/federation/deployments/{domain}/key",
  "PUT /admin/federation/deployments/{domain}/lists/{list}",
  "DELETE /admin/federation/deployments/{domain}/lists/{list}",
  "PATCH /deployment",
  "GET /admin/plugins",
  "PATCH /admin/plugins/{plugin}",
  "PUT /admin/plugin-order",
  "GET /admin/newsletter/posts",
  "POST /admin/newsletter/posts",
  "GET /admin/newsletter/posts/{post}",
  "PATCH /admin/newsletter/posts/{post}",
  "DELETE /admin/newsletter/posts/{post}",
]
limits = { user = { requests = 120, per_seconds = 60, burst = 30, bucket = "admin" } }

# Shaping communities, their channels and invites, calls, and the voice server registry.
[rate_limits.groups.manage]
endpoints = [
  "PATCH /communities/{community}",
  "DELETE /communities/{community}",
  "POST /communities/{community}/categories",
  "PATCH /categories/{category}",
  "DELETE /categories/{category}",
  "POST /channels",
  "PATCH /channels/{channel}",
  "DELETE /channels/{channel}",
  "POST /communities/{community}/invites",
  "PATCH /invites/{code}",
  "DELETE /invites/{code}",
  "PATCH /channels/{channel}/voice/participants/{user}",
  "DELETE /channels/{channel}/voice/participants/{user}",
  "PUT /communities/{community}/voice-mutes/{user}",
  "DELETE /communities/{community}/voice-mutes/{user}",
  "POST /voice-servers",
  "PATCH /voice-servers/{server}",
  "DELETE /voice-servers/{server}",
  "PUT /communities/{community}/owner",
  "POST /communities/{community}/roles",
  "POST /polls/{poll}/close",
  "PUT /communities/{community}/bans/{user}",
  "DELETE /communities/{community}/bans/{user}",
  "POST /communities/{community}/emoji",
  "PATCH /emoji/{emoji}",
  "DELETE /emoji/{emoji}",
  "PUT /communities/{community}/role-order",
  "PATCH /roles/{role}",
  "DELETE /roles/{role}",
  "PUT /communities/{community}/members/{user}/roles/{role}",
  "DELETE /communities/{community}/members/{user}/roles/{role}",
  "DELETE /communities/{community}/members/{user}",
  "DELETE /communities/{community}/members/{user}/nickname",
  "PUT /channels/{channel}/overrides/{role}",
  "DELETE /channels/{channel}/overrides/{role}",
  "PUT /categories/{category}/overrides/{role}",
  "DELETE /categories/{category}/overrides/{role}",
  "PUT /messages/{message}/pin",
  "DELETE /messages/{message}/pin",
  "DELETE /messages/{message}/reactions/{emoji}/{user}",
  "DELETE /messages/{message}/attachments/{attachment}",
  "PUT /communities/{community}/plugins/{plugin}",
  "PATCH /communities/{community}/plugins/{plugin}",
  "DELETE /communities/{community}/plugins/{plugin}",
]
limits = { user = { requests = 60, per_seconds = 60, burst = 20, bucket = "manage" } }

# Plugins' own routes (`app::plugin::route`): each runs a plugin, which may call other hosts, so
# each user's requests to one plugin are counted apart, and every user's together.
[rate_limits.groups.plugin_routes]
endpoints = [
  "GET /plugins/{plugin}/routes/{*path}",
  "POST /plugins/{plugin}/routes/{*path}",
  "PUT /plugins/{plugin}/routes/{*path}",
  "PATCH /plugins/{plugin}/routes/{*path}",
  "DELETE /plugins/{plugin}/routes/{*path}",
]
limits = { user_per_plugin = { requests = 120, per_seconds = 60, burst = 30, bucket = "plugin_routes" }, per_plugin = { requests = 6000, per_seconds = 60, burst = 600, bucket = "plugin_routes_all" } }

# A card's button calls its plugin as the person who pressed it.
[rate_limits.endpoints."POST /messages/{message}/card/buttons/{button}"]
user = { requests = 60, per_seconds = 60, burst = 20, bucket = "plugin_routes" }

# The files of plugins' views, which every frame showing one loads.
[rate_limits.endpoints."GET /plugins/{plugin}/assets/{*path}"]
ip = { requests = 600, per_seconds = 60, burst = 200 }

# Private URLs that reach a plugin as their owner, such as a calendar app's feed, which polls.
[rate_limits.endpoints."GET /plugins/{plugin}/capabilities/{secret}"]
ip = { requests = 60, per_seconds = 60, burst = 20 }
per_secret = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."POST /auth/login"]
# Attempts at one username from one network (an IPv4 /24, an IPv6 /48), counted before the
# password is checked, so guesses from one network cannot lock the name out everywhere else.
username = { requests = 10, per_seconds = 600, burst = 5 }
# Wrong passwords for one username from anywhere, guessed from many networks at once: looked
# at before the password is checked and counted only once it proves wrong, so the owner's own
# right passwords never spend it. Spent, password sign-in for the name is refused until it
# refills; passkeys, device links, and password resets still reach the account.
username_failures = { requests = 30, per_seconds = 600, burst = 20 }

[rate_limits.endpoints."POST /users"]
ip = { requests = 5, per_seconds = 3600, burst = 3 }
# Every account made, from everyone together: enough for a launch's rush (600 at once, then
# twenty a second, 72000 an hour), while a crowd of addresses cannot make accounts without end.
# A deployment expecting more raises it in aspen.toml.
global = { requests = 1200, per_seconds = 60, burst = 600 }

# Each sends mail: a code to an address the caller says is theirs.
[rate_limits.endpoints."POST /users/{user}/email/verification-codes"]
user = { requests = 5, per_seconds = 3600, burst = 3 }

# Starting a reset, a passkey ceremony, or a device link each keeps a little state in Valkey
# until it expires (half an hour, five minutes, a minute), so everyone's starts together are
# limited too, generously, to bound what a crowd of addresses can store there.
[rate_limits.endpoints."POST /auth/password-resets"]
global = { requests = 600, per_seconds = 60, burst = 300 }

[rate_limits.endpoints."POST /auth/passkey-ceremonies"]
global = { requests = 3000, per_seconds = 60, burst = 1000 }

[rate_limits.endpoints."POST /auth/device-links"]
global = { requests = 3000, per_seconds = 60, burst = 1000 }

# Each mails the reset code again, to an address its asker answered with; the account's mail
# is also limited where it is queued (`app::email::reset`).
[rate_limits.endpoints."POST /auth/password-resets/{reset}/codes"]
per_reset = { requests = 5, per_seconds = 1800, burst = 3 }

[rate_limits.endpoints."POST /auth/password-resets/{reset}/completion"]
per_reset = { requests = 10, per_seconds = 1800, burst = 5 }

# Each mails the post to its sender; sending it to everyone happens once per post.
[rate_limits.endpoints."POST /admin/newsletter/posts/{post}/test"]
user = { requests = 10, per_seconds = 600, burst = 3 }

[rate_limits.endpoints."POST /admin/newsletter/posts/{post}/sending"]
user = { requests = 5, per_seconds = 3600, burst = 3 }

# The page unsubscribe links in mail open, and the one-click unsubscribe mail programs post.
[rate_limits.endpoints."GET /email/unsubscribe"]
ip = { requests = 30, per_seconds = 60, burst = 10, bucket = "unsubscribe" }

[rate_limits.endpoints."POST /email/unsubscribe"]
ip = { requests = 30, per_seconds = 60, burst = 10, bucket = "unsubscribe" }

[rate_limits.endpoints."POST /auth/token-refresh"]
ip = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."GET /auth/methods"]
ip = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."GET /deployment"]
# The sign-in screen reads it each time it opens.
ip = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."GET /.well-known/aspen"]
# Other deployments read it when they meet this one and now and then after; each API server of
# theirs reads it on its own.
ip = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."POST /auth/assertions"]
# A client asks for one each time it signs in somewhere; people have a handful of deployments.
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."POST /federation/notices"]
# Other deployments tell this one about its users; each of their servers may send on its own.
ip = { requests = 120, per_seconds = 60, burst = 60 }

[rate_limits.endpoints."POST /federation/standing"]
# Each deployment the home's users use asks about them in batches, about hourly.
ip = { requests = 60, per_seconds = 60, burst = 30 }

[rate_limits.endpoints."GET /federation/icons/{icon}"]
# Other deployments copy an avatar when it changes; each of their servers may ask on its own.
ip = { requests = 120, per_seconds = 60, burst = 60 }

[rate_limits.endpoints."POST /admin/federation/deployments/{domain}/contact"]
# Each makes a call to another deployment.
user = { requests = 20, per_seconds = 60, burst = 10 }
user_per_domain = { requests = 6, per_seconds = 60, burst = 5 }

[rate_limits.endpoints."GET /events"]
# Reconnecting event streams; a whole office may share the address.
ip = { requests = 60, per_seconds = 60, burst = 30 }

[rate_limits.endpoints."POST /channels/{channel}/messages"]
user_per_channel = { requests = 5, per_seconds = 5, burst = 10 }
user = { requests = 60, per_seconds = 60, burst = 20 }
# A whole channel's flood, however many accounts take part.
per_channel = { requests = 50, per_seconds = 10, burst = 50 }

[rate_limits.endpoints."POST /channels/{channel}/commands"]
# A command is a message in the channel and an event for its bot, and checking it can read
# several records.
user_per_channel = { requests = 5, per_seconds = 5, burst = 10 }
user = { requests = 60, per_seconds = 60, burst = 20 }
per_channel = { requests = 50, per_seconds = 10, burst = 50 }

[rate_limits.endpoints."POST /channels/{channel}/polls"]
user_per_channel = { requests = 3, per_seconds = 60, burst = 3 }

[rate_limits.endpoints."PATCH /messages/{message}"]
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."PATCH /attachments/{attachment}"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."DELETE /messages/{message}"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."PUT /messages/{message}/reactions/{emoji}/@me"]
user = { requests = 120, per_seconds = 60, burst = 20, bucket = "reactions" }
user_per_message = { requests = 20, per_seconds = 10, burst = 20, bucket = "reactions" }

[rate_limits.endpoints."DELETE /messages/{message}/reactions/{emoji}/@me"]
user = { requests = 120, per_seconds = 60, burst = 20, bucket = "reactions" }
user_per_message = { requests = 20, per_seconds = 10, burst = 20, bucket = "reactions" }

# Counts every reaction the caller has made; clients read it once and again after they react.
[rate_limits.endpoints."GET /users/{user}/frequent-emoji"]
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."PUT /messages/{message}/thread"]
user = { requests = 20, per_seconds = 60, burst = 10 }

# Posts a message, and makes a thread when it is the first reply. Clients post later replies to
# the thread itself, so the limits are those of making threads, with a thread's flood besides.
[rate_limits.endpoints."POST /messages/{message}/thread/messages"]
user = { requests = 20, per_seconds = 60, burst = 10 }
per_message = { requests = 50, per_seconds = 10, burst = 50 }

# An echo posts in the parent channel, and deleting it frees the reply to be echoed again.
[rate_limits.endpoints."PUT /messages/{message}/echo"]
user = { requests = 20, per_seconds = 60, burst = 10 }
user_per_message = { requests = 3, per_seconds = 60, burst = 3 }

[rate_limits.endpoints."PUT /polls/{poll}/votes/{option}/@me"]
user = { requests = 60, per_seconds = 60, burst = 20, bucket = "votes" }

[rate_limits.endpoints."DELETE /polls/{poll}/votes/{option}/@me"]
user = { requests = 60, per_seconds = 60, burst = 20, bucket = "votes" }

# A write-in adds an answer everyone sees, so it is slower than a vote.
[rate_limits.endpoints."POST /polls/{poll}/write-ins"]
user = { requests = 10, per_seconds = 60, burst = 3 }
per_poll = { requests = 60, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."DELETE /polls/{poll}/write-ins/{option}"]
user = { requests = 30, per_seconds = 60, burst = 10 }

# Clients report reading as it happens, at most every few seconds per channel, and a reader
# moving between channels reports each one.
[rate_limits.endpoints."PUT /channels/{channel}/read-states/@me"]
user = { requests = 120, per_seconds = 60, burst = 30 }

# Muting and unmuting are the caller's own settings, but each change is published.
[rate_limits.endpoints."PUT /channels/{channel}/mutes/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."DELETE /channels/{channel}/mutes/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# Saving a message and following a thread are the caller's own, but each change is published.
[rate_limits.endpoints."PUT /users/@me/saved-messages/{message}"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."DELETE /users/@me/saved-messages/{message}"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."PUT /channels/{channel}/follows/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."DELETE /channels/{channel}/follows/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# The feed reads across every channel the caller reads, as search does, though a person paging
# down it or switching its filters asks for more pages than they search.
[rate_limits.endpoints."GET /users/@me/activity"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# Folding a category is the caller's own setting, but each change is published.
[rate_limits.endpoints."PUT /categories/{category}/collapses/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

[rate_limits.endpoints."DELETE /categories/{category}/collapses/@me"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# Making a bot makes an account, and issuing a token is something to do rarely.
[rate_limits.endpoints."POST /users/@me/bots"]
user = { requests = 10, per_seconds = 3600, burst = 3 }

[rate_limits.endpoints."PUT /bots/{bot}/commands"]
# A bot publishes its list when it starts or changes; each publish is checked whole and
# announced wherever the bot is.
user = { requests = 30, per_seconds = 3600, burst = 5 }

[rate_limits.endpoints."POST /bots/{bot}/token"]
user = { requests = 10, per_seconds = 600, burst = 3 }

# Each offer of a bot sends its recipient a notice from the system account.
[rate_limits.endpoints."PUT /bots/{bot}/transfer"]
user = { requests = 10, per_seconds = 600, burst = 3 }

# Reporting a message, a profile, or a nickname: ten back to back, and fifty a day, across all
# three.
[rate_limits.endpoints."POST /messages/{message}/reports"]
user = { requests = 50, per_seconds = 86400, burst = 10, bucket = "reports" }

[rate_limits.endpoints."POST /users/{user}/reports"]
user = { requests = 50, per_seconds = 86400, burst = 10, bucket = "reports" }

[rate_limits.endpoints."POST /communities/{community}/members/{user}/nickname/reports"]
user = { requests = 50, per_seconds = 86400, burst = 10, bucket = "reports" }

[rate_limits.endpoints."PATCH /bots/{bot}"]
user = { requests = 30, per_seconds = 600, burst = 10 }

# Adding a bot adds a member, and may make a role.
[rate_limits.endpoints."PUT /communities/{community}/members/{user}"]
user = { requests = 30, per_seconds = 600, burst = 10 }

[rate_limits.endpoints."DELETE /bots/{bot}"]
user = { requests = 30, per_seconds = 600, burst = 10 }

# Blocking is the caller's own setting, but each change is published.
[rate_limits.endpoints."PUT /users/@me/blocks/{user}"]
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."DELETE /users/@me/blocks/{user}"]
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."POST /communities"]
user = { requests = 10, per_seconds = 3600, burst = 3 }

[rate_limits.endpoints."PUT /communities/{community}/members/@me"]
user = { requests = 20, per_seconds = 3600, burst = 5 }
ip = { requests = 60, per_seconds = 3600, burst = 20 }

# A nickname is announced to the whole community; reordering one's list is cheap but rides the
# same endpoint, so the limit is per community and roomy.
[rate_limits.endpoints."PATCH /communities/{community}/members/@me"]
user_per_community = { requests = 30, per_seconds = 600, burst = 10 }

# Searching members: generous for someone typing into a picker, too slow to page through a
# large community quickly.
[rate_limits.endpoints."GET /communities/{community}/members"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# Searching messages reads an index across everything the user may read: enough for someone
# searching and paging through results by hand.
[rate_limits.endpoints."GET /messages"]
user = { requests = 30, per_seconds = 60, burst = 10 }

# A phone registers when it signs in and when its push service gives it a new endpoint; each
# registration is a URL this server will call.
[rate_limits.endpoints."POST /users/@me/push-subscriptions"]
user = { requests = 20, per_seconds = 3600, burst = 5 }

[rate_limits.endpoints."GET /invites/{code}"]
# Guessing invite codes. Making an invite with a code of one's own choosing says whether that
# code is taken, so it counts in the same budget.
user = { requests = 30, per_seconds = 60, burst = 10, bucket = "inviteLookup" }

[rate_limits.endpoints."POST /communities/{community}/invites"]
user = { requests = 30, per_seconds = 60, burst = 10, bucket = "inviteLookup" }

[rate_limits.endpoints."GET /invite/{code}"]
# The web client's invite page, which shows the invite's community to anyone: guessing invite
# codes, with room for the services that unfurl links shared in a busy place. Checked by the
# page itself, which over them is served as the deployment's rather than refused.
ip = { requests = 60, per_seconds = 60, burst = 30 }

[rate_limits.endpoints."GET /registration-invites/{code}"]
# Guessing registration invite codes, which anyone may try.
ip = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."POST /users/@me/dms"]
user = { requests = 30, per_seconds = 600, burst = 10 }

[rate_limits.endpoints."PUT /channels/{channel}/recipients/{user}"]
user = { requests = 30, per_seconds = 600, burst = 10 }

[rate_limits.endpoints."GET /users/statuses"]
# The client asks every thirty seconds per device, and again when a page comes into view.
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."GET /channels/{channel}/presence"]
# The client asks for the open channel with every presence poll, every thirty seconds per
# device, and again when the channel changes.
user = { requests = 30, per_seconds = 60, burst = 10 }

[rate_limits.endpoints."PATCH /users/{user}"]
user = { requests = 20, per_seconds = 60, burst = 5 }

[rate_limits.endpoints."PATCH /users/{user}/preferences"]
user = { requests = 60, per_seconds = 60, burst = 20 }

# Every move to another call asks for an offer; as the voice servers' own limits do, this lets
# someone join a dozen calls back to back.
[rate_limits.endpoints."POST /channels/{channel}/voice/join"]
user = { requests = 30, per_seconds = 60, burst = 12 }

[rate_limits.endpoints."POST /voice-servers/{server}/failures"]
user = { requests = 10, per_seconds = 60, burst = 5 }
