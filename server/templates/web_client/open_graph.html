{#- What the web client's index.html is given before its </head> (`api::web_client`). -#}
    <title>{{ tags.title }}</title>
    <meta name="description" content="{{ tags.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ tags.site_name }}" />
    <meta property="og:title" content="{{ tags.title }}" />
    <meta property="og:description" content="{{ tags.description }}" />
    <meta property="og:url" content="{{ tags.url }}" />
    <meta property="og:image" content="{{ tags.image.url }}" />
    <meta property="og:image:type" content="{{ tags.image.mime_type }}" />
    <meta property="og:image:alt" content="{{ tags.image.alt }}" />
{%- if let Some(size) = tags.image.size %}
    <meta property="og:image:width" content="{{ size }}" />
    <meta property="og:image:height" content="{{ size }}" />
{%- endif %}
    <meta name="twitter:card" content="summary" />
