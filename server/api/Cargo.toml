[package]
name = "aspen_api"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The API server's HTTP front end: the REST handlers and their OpenAPI document, the event stream, rate limits by route, and the web client and pages it serves."

[dependencies]
axum = { version = "0.8.4", features = ["macros", "ws"] }
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.10", features = ["uuid", "chrono", "postgres", "r2d2", "serde_json"] }
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["serde", "v7"] }
base64 = "0.22.1"
diesel-async = { version = "0.7.4", features = ["deadpool", "postgres", "r2d2"] }
hyper = { version = "1.6.0", features = ["http1", "http2", "server"] }
tower = { version = "0.5.2", features = ["tokio", "tracing"] }
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
bytes = "1.10.1"
config = { version = "0.15.14", features = ["toml"] }
rust-i18n = "3.1.5"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid", "yaml"] }
utoipa-axum = "0.2.0"
schemars = { version = "1.2.1", features = ["chrono04", "uuid1"] }
tungstenite = "0.28.0"
url = "2.5.8"
aspen_limits = { version = "0.1.0", path = "../../limits" }
aspen_metrics = { version = "0.1.0", path = "../../metrics", features = ["jemalloc"] }
metrics = "0.24"
aspen_wire = { version = "0.1.0", path = "../wire" }
askama = "0.16.1"
aspen_app = { version = "0.1.0", path = "../app" }
aspen_locale = { version = "0.1.0", path = "../locale" }

[dev-dependencies]
serde_urlencoded = "0.7.1"
