[package]
name = "aspen_locale"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The API server's catalogue of client-facing text, the language each request is answered in, and the pseudo-locales made from English."

[dependencies]
axum = "0.8.4"
rust-i18n = "3.1.5"
tokio = { version = "1.44.2", features = ["macros", "rt"] }

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
