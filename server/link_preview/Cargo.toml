[package]
name = "aspen_link_preview"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Fetching pages and reading their metadata for the API server's link previews, Reddit posts and video players included."

[dependencies]
aspen_outbound = { version = "0.1.0", path = "../outbound" }
aspen_wire = { version = "0.1.0", path = "../wire" }
futures-util = "0.3.31"
html5ever = "0.39.0"
lru = "0.17.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "http2", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["macros", "rt", "time"] }
tracing = "0.1.41"
url = "2.5.8"
