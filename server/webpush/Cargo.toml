[package]
name = "aspen_webpush"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Web Push messages as a deployment sends them: encrypted to the phone (RFC 8291) and signed with the deployment's push key (RFC 8292, VAPID)."

[dependencies]
base64 = "0.22.1"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
