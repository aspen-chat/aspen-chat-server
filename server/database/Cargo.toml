[package]
name = "aspen_database"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Connecting to PostgreSQL as `database_url` says, over TLS when it asks for it."

[dependencies]
diesel = { version = "2.2.10", features = ["postgres"] }
diesel-async = { version = "0.7.4", features = ["deadpool", "postgres"] }
futures-util = "0.3.31"
percent-encoding = "2.3.1"
openssl = "0.10.81"
postgres-openssl = "0.5.3"
thiserror = "2.0.18"
tokio-postgres = "0.7.13"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
